<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>اسم بنت ولد حيوان جماد بلاد نبات</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:radial-gradient(circle at top,#1b376b,#071120 55%,#02050c);
  color:white;
  min-height:100vh;
}
.wrap{
  width:min(92%,1200px);
  margin:auto;
  padding:28px 0 40px;
}
.title{
  text-align:center;
  font-size:52px;
  font-weight:900;
  margin:10px 0 30px;
  color:#fff;
  text-shadow:0 6px 20px rgba(0,0,0,.45);
}
.title .iconBox{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:56px;
  height:56px;
  margin-right:12px;
  background:#0b89d8;
  border:4px solid #02050c;
  box-shadow:0 6px 0 rgba(0,0,0,.45);
  color:white;
  font-size:20px;
  vertical-align:middle;
}
.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:28px;
  padding:26px;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
}
.join-card{
  margin:0 auto 22px;
  max-width:820px;
}
.join-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  align-items:center;
  margin-bottom:14px;
}
.join-row-bottom{
  display:grid;
  grid-template-columns:1fr 92px;
  gap:16px;
  align-items:center;
  max-width:440px;
  margin:auto;
}
input,select,button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px 16px;
  font-size:18px;
}
input,select{
  background:#f4f7ff;
  color:#111827;
  border:1px solid rgba(255,255,255,.18);
  text-align:center;
}
button{
  cursor:pointer;
  font-weight:900;
  background:linear-gradient(#75f4a4,#16c76b);
  color:#06220f;
  box-shadow:0 8px 0 rgba(0,0,0,.22);
}
button:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.secondary{background:#334155;color:white}
.danger{background:#ef4444;color:white}
.ok{background:#22c55e;color:white}
.game-grid{display:grid;grid-template-columns:330px 1fr;gap:16px}
.side h3{margin:8px 0 12px;font-size:22px}
.host-settings{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 14px;font-weight:800}
.letter{font-size:76px;line-height:1;text-align:center;font-weight:900;color:#38bdf8;text-shadow:0 0 28px rgba(56,189,248,.55);margin:12px 0}
.timer{font-size:42px;text-align:center;font-weight:900;color:#fb7185}
.players{display:flex;flex-direction:column;gap:8px;min-height:80px}
.player{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:rgba(0,0,0,.28);padding:10px;border-radius:12px}
.host{outline:2px solid #fbbf24}.submitted{color:#22c55e;font-weight:900}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{font-weight:800;color:#cbd5e1}.field input{margin-top:5px}.hide{display:none!important}
table{width:100%;border-collapse:collapse;margin-top:10px;background:rgba(0,0,0,.18);border-radius:12px;overflow:hidden}th,td{border-bottom:1px solid rgba(255,255,255,.12);padding:9px;text-align:center}th{background:rgba(255,255,255,.1);color:#fbbf24}.bad{color:#f87171}.good{color:#4ade80}.small{font-size:13px;color:#cbd5e1}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid #fbbf24;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:9999}
.exit-main{max-width:220px;margin:18px auto 0;display:block;background:#334155;color:white}
@media(max-width:900px){
  .title{font-size:38px}.title .iconBox{width:44px;height:44px;font-size:16px}
  .join-row,.join-row-bottom,.game-grid,.formgrid{grid-template-columns:1fr}
  .join-row-bottom{max-width:none}
  .letter{font-size:56px}
}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="wrap">
  <div class="title">اسم بنت ولد <span class="iconBox">abc</span></div>

  <div id="joinPanel" class="card join-card">
    <div class="join-row">
      <input id="room" placeholder="ROOM1" value="ROOM1" />
      <input id="name" placeholder="اسم اللاعب" />
    </div>
    <div class="join-row-bottom">
      <input id="avatar" placeholder="🎮" value="🎮" />
      <button onclick="joinGame()">دخول</button>
    </div>
  </div>

  <div id="gamePanel" class="game-grid hide">
    <div class="card side">
      <button class="secondary" onclick="leaveGame()">خروج</button>
      <div id="hostBox" class="host-settings hide">
        <h3>إعدادات القائد</h3>
        <div class="row">
          <select id="roundLimit"><option value="3">3 جولات</option><option value="5" selected>5 جولات</option><option value="10">10 جولات</option></select>
          <select id="timeLimit"><option value="30">30 ثانية</option><option value="45" selected>45 ثانية</option><option value="60">60 ثانية</option><option value="90">90 ثانية</option></select>
        </div>
        <button class="secondary" onclick="endRound()">إنهاء الجولة</button>
        <button class="ok" onclick="startRound()">ابدأ الجولة / الجولة التالية</button>
        <button class="danger" onclick="resetGame()">تصفير اللعبة</button>
      </div>
      <h3>اللاعبين</h3>
      <div id="players" class="players"></div>
    </div>
      <h3>إضافة كلمة للقاموس</h3>

      <select id="newWordCategory">
          <option value="girls">اسم بنت</option>
          <option value="boys">اسم ولد</option>
          <option value="animals">حيوان</option>
          <option value="objects">جماد</option>
          <option value="countries">بلاد</option>
          <option value="plants">نبات</option>
        </select>

        <input id="newWordInput" placeholder="اكتب الكلمة الجديدة">

        <button onclick="addNewWord()">إضافة الكلمة</button>
    <div class="card">
      <div class="meta">
        <div class="pill">الروم: <span id="roomShow">---</span></div>
        <div class="pill">القائد: <span id="hostShow">---</span></div>
        <div class="pill">الجولة: <span id="roundShow">0/0</span></div>
        <div class="pill">الحالة: <span id="statusShow">انتظار</span></div>
      </div>
      <div class="letter" id="letterShow">؟</div>
      <div class="timer" id="timerShow">0</div>
      <p class="small" style="text-align:center">اكتب كل الإجابات بنفس الحرف. البلاد مثل "السعودية" تُحسب على حرف س.</p>

      <div id="answerBox" class="formgrid">
        <div class="field"><label>اسم بنت</label><input id="girls" placeholder="مثال: سارة"></div>
        <div class="field"><label>اسم ولد</label><input id="boys" placeholder="مثال: سعود"></div>
        <div class="field"><label>حيوان</label><input id="animals" placeholder="مثال: سمكة"></div>
        <div class="field"><label>جماد</label><input id="objects" placeholder="مثال: سرير"></div>
        <div class="field"><label>بلاد</label><input id="countries" placeholder="مثال: سوريا"></div>
        <div class="field"><label>نبات</label><input id="plants" placeholder="مثال: سبانخ"></div>
      </div>
      <button id="submitBtn" onclick="submitAnswers()">تسليم الإجابات</button>
      <div id="results"></div>
    </div>
  </div>

  <button class="exit-main secondary" onclick="location.href='/'">رجوع لاختيار اللعبة</button>
</div>
<script>
const socket = io({
  transports: ["websocket", "polling"]
});
let myPid = localStorage.getItem('categories_pid');
if(!myPid){ myPid = 'cat_' + Math.random().toString(36).slice(2) + Date.now(); localStorage.setItem('categories_pid', myPid); }
let currentRoom = localStorage.getItem('categories_room') || 'ROOM1';
let state = null;
document.getElementById('room').value = currentRoom;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function val(id){return document.getElementById(id).value.trim()}
function setInputsDisabled(disabled){['girls','boys','animals','objects','countries','plants'].forEach(id=>document.getElementById(id).disabled=disabled);document.getElementById('submitBtn').disabled=disabled}
function clearInputs(){['girls','boys','animals','objects','countries','plants'].forEach(id=>document.getElementById(id).value='')}
function joinGame(){currentRoom=val('room')||'ROOM1';localStorage.setItem('categories_room', currentRoom);socket.emit('categories_join',{room:currentRoom,name:val('name')||'لاعب',avatar:val('avatar')||'🎮',pid:myPid})}
function startRound(){socket.emit('categories_start',{room:currentRoom,timeLimit:val('timeLimit'),roundLimit:val('roundLimit')})}
function resetGame(){socket.emit('categories_reset',{room:currentRoom})}
function leaveGame(){socket.emit('categories_leave',{room:currentRoom,pid:myPid});location.href='/'}
function kick(pid){socket.emit('categories_kick',{room:currentRoom,targetPid:pid})}
function submitAnswers(){const answers={};['girls','boys','animals','objects','countries','plants'].forEach(k=>answers[k]=val(k));socket.emit('categories_submit',{room:currentRoom,pid:myPid,answers});}

socket.on('categories_joined', d=>{myPid=d.pid;currentRoom=d.room;localStorage.setItem('categories_pid',myPid);localStorage.setItem('categories_room',currentRoom);document.getElementById('joinPanel').classList.add('hide');document.getElementById('gamePanel').classList.remove('hide')});
socket.on('categories_error', d=>toast(d.message||'خطأ'));
socket.on('categories_submitted', ()=>{toast('تم تسليم إجاباتك');setInputsDisabled(true)});
socket.on('categories_kicked', ()=>{toast('تم طردك من الروم');setTimeout(()=>location.href='/',1000)});
socket.on('categories_left', ()=>{});
socket.on('categories_state', s=>{state=s;render();});

function statusText(st){return st==='started'?'الجولة شغالة':st==='round_finished'?'انتهت الجولة':st==='game_finished'?'انتهت اللعبة':'انتظار'}
function render(){
  document.getElementById('joinPanel').classList.add('hide');
  document.getElementById('gamePanel').classList.remove('hide');
  document.getElementById('roomShow').textContent=state.room;
  document.getElementById('hostShow').textContent=state.hostName||'---';
  document.getElementById('roundShow').textContent=(state.round||0)+'/'+(state.roundLimit||0);
  document.getElementById('statusShow').textContent=statusText(state.status);
  document.getElementById('letterShow').textContent=state.letter||'؟';
  document.getElementById('timerShow').textContent=state.timeLeft||0;
  const isHost = state.host === myPid;
  document.getElementById('hostBox').classList.toggle('hide', !isHost);

  let plist='';
  (state.players||[]).forEach(p=>{
    const sub=(state.submitted||[]).includes(p.pid);
    plist += `<div class="player ${p.pid===state.host?'host':''}"><div>${p.name} ${sub?'<span class="submitted">✓</span>':''}<div class="small">آخر جولة: ${p.lastRoundScore||0}</div></div><b>${p.score||0}</b>${isHost&&p.pid!==myPid?`<button class="danger" style="width:auto;padding:8px 10px" onclick="kick('${p.pid}')">طرد</button>`:''}</div>`;
  });
  document.getElementById('players').innerHTML=plist||'<div class="small">لا يوجد لاعبين</div>';

  if(state.status==='started'){
    document.getElementById('results').innerHTML='';
    const already=(state.submitted||[]).includes(myPid);
    setInputsDisabled(already);
  }else{
    setInputsDisabled(true);
  }
  if(state.status==='started' && !(state.submitted||[]).includes(myPid)) document.getElementById('submitBtn').disabled=false;
  if(state.status==='round_finished' || state.status==='game_finished') renderResults();
  if(state.status==='waiting' || state.status==='round_finished') clearInputs();
}
function renderResults(){
  const labels={girls:'اسم بنت',boys:'اسم ولد',animals:'حيوان',objects:'جماد',countries:'بلاد',plants:'نبات'};
  let html=`<h3>نتيجة الجولة</h3><p class="small">${state.message||''}</p>`;
  (state.roundResults||[]).forEach(r=>{
    html += `<table><tr><th colspan="4">${r.name} — ${r.roundScore} نقطة ${r.bonus?`(+${r.bonus} سرعة)`:''}</th></tr><tr><th>الفئة</th><th>الإجابة</th><th>النقاط</th><th>السبب</th></tr>`;
    Object.keys(labels).forEach(k=>{const it=r.items[k]||{};html+=`<tr><td>${labels[k]}</td><td class="${it.ok?'good':'bad'}">${it.word||'-'}</td><td>${it.points||0}</td><td>${it.reason||''}</td></tr>`});
    html += `</table>`;
  });
  if(state.finalResults){html += `<h3>🏆 الترتيب النهائي</h3><table><tr><th>المركز</th><th>اللاعب</th><th>النقاط</th></tr>`;state.finalResults.forEach((p,i)=>{html+=`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.score}</td></tr>`});html+='</table>'}
  document.getElementById('results').innerHTML=html;
}
  function endRound(){
  socket.emit('categories_end_round', {room: currentRoom});
}
  function addNewWord(){
  socket.emit('categories_add_word', {
    room: currentRoom,
    category: document.getElementById('newWordCategory').value,
    word: document.getElementById('newWordInput').value.trim()
  });

  document.getElementById('newWordInput').value = '';
}
</script>
</body>
</html>
