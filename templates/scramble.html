<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سرقة الحروف</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body{margin:0;font-family:Arial;background:#111;color:white;text-align:center}
    .wrap{max-width:900px;margin:auto;padding:18px}
    .card{background:#1e1e1e;border:1px solid #333;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 0 20px #0006}
    input,select,button{font-size:18px;border-radius:12px;border:0;padding:12px;margin:5px}
    input,select{background:#fff;color:#111;min-width:180px}
    button{background:#e2b44b;color:#111;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    .word{font-size:48px;letter-spacing:10px;font-weight:bold;color:#ffd15c;margin:20px 0;direction:rtl}
    .players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
    .player{background:#292929;border-radius:14px;padding:12px;border:1px solid #444}
    .dead{opacity:.45;text-decoration:line-through}
    .me{border-color:#ffd15c;box-shadow:0 0 12px #ffd15c55}
    .msg{font-size:22px;color:#8ff;margin:10px 0;min-height:28px;line-height:1.6}
    .timer{font-size:36px;color:#ff6666;font-weight:bold}
    .hidden{display:none}
    .danger{background:#d94b4b;color:white}
    .leave{background:#555;color:white}
    .good{background:#48b36a;color:white}
    .small{font-size:14px;opacity:.8;margin-top:6px}
    .badge{display:inline-block;background:#333;border:1px solid #555;border-radius:999px;padding:4px 9px;margin:3px;font-size:14px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🏴‍☠️ سرقة الحروف</h1>

  <div id="joinBox" class="card">
    <h2>دخول الغرفة</h2>
    <input id="room" placeholder="رمز الغرفة" value="ROOM1">
    <input id="name" placeholder="اسم اللاعب">
    <input id="avatar" placeholder="الرمز" value="🎮">
    <button onclick="joinGame()">دخول</button>
  </div>

  <div id="gameBox" class="hidden">
    <div class="card">
      <div>الغرفة: <b id="roomTitle"></b></div>
      <button class="leave" onclick="leaveGame()">خروج</button>
      <div class="small">الفئة: <b id="categoryTitle">---</b> | الجولة: <b id="roundTitle">0</b></div>
      <div class="msg" id="message"></div>
      <div class="timer" id="timer">0</div>

      <div class="word" id="scrambled">---</div>

      <div id="correctAnswerBox"
      style="display:none;font-size:38px;font-weight:bold;color:#7CFF7C;margin:15px 0">
      </div>

      <input id="answer" placeholder="اكتب الكلمة الصحيحة">
      <button onclick="sendAnswer()">إرسال</button>
      
    </div>

    <div id="hostBox" class="card hidden">
      <h3>إعدادات القائد</h3>
      <div style="margin:8px 0">
      <div>🏁 عدد الجولات</div>

        <select id="roundLimit">
          <option value="5">5 جولات</option>
          <option value="10" selected>10 جولات</option>
          <option value="15">15 جولة</option>
          <option value="20">20 جولة</option>
          <option value="30">30 جولة</option>
          <option value="40">40 جولة</option>
       </select>
      </div>

      <select id="startPoints">
        <option value="5">5 نقاط</option>
        <option value="10" selected>10 نقاط</option>
        <option value="15">15 نقطة</option>
      </select>

      <select id="timeLimit">
        <option value="10">10 ثواني</option>
        <option value="20" selected>20 ثانية</option>
        <option value="30">30 ثانية</option>
        <option value="45">45 ثانية</option>
        <option value="60">60 ثانية</option>
      </select>

      <select id="roundMode">
        <option value="auto" selected>تلقائي</option>
        <option value="manual">يدوي بواسطة القائد</option>
    </select>

    <select id="autoDelay">
        <option value="5">5 ثواني</option>
        <option value="10" selected>10 ثواني</option>
        <option value="15">15 ثانية</option>
        <option value="20">20 ثانية</option>
        <option value="30">30 ثانية</option>
    </select>

      <select id="wordCategory">
        <option value="general" selected>كلمات عامة</option>
        <option value="countries">دول</option>
        <option value="football">لاعبين كرة</option>
        <option value="movies">أفلام</option>
        <option value="anime">شخصيات أنمي</option>
        <option value="famous">مشاهير</option>
        <option value="brands">شركات وماركات</option>
        <option value="games">ألعاب</option>
        <option value="cars">سيارات</option>
        <option value="animals">حيوانات</option>
      </select>
      <br>
      <button onclick="startGame()">ابدأ اللعبة</button>
      <button class="good" onclick="nextRound()">الجولة التالية</button>
      <button onclick="resetGame()">إعادة</button>

      <div class="small">كل 5 جولات = سرقة نقطتين 🔥 | 3 إجابات متتالية = درع 🛡️</div>
    </div>

    <div id="stealBox" class="card hidden">
      <h2 id="stealTitle">اختر لاعب تسرق منه نقطة</h2>
      <div id="stealTargets" class="players"></div>
    </div>

    <div class="card">
      <h2>اللاعبون</h2>
      <div id="players" class="players"></div>
    </div>
    </div>
    </div>

    <!-- شاشة الفائز -->
    <div id="winnerScreen" class="hidden" style="
    display:none;
    position:fixed;
    inset:0;
    background:radial-gradient(circle,#2b1b00,#050505 70%);
    z-index:9999;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    ">
      <div style="
        background:#111;
        border:3px solid #ffd15c;
        border-radius:30px;
        padding:35px;
        width:min(90%,600px);
        box-shadow:0 0 60px #ffd15c88;
      ">
        <div style="font-size:70px">🏆</div>
        <h1 id="winnerName" style="color:#ffd15c;font-size:42px"></h1>
        <h2>النتائج النهائية</h2>
        <div id="finalScores"></div>
        <button onclick="closeWinner()">إغلاق</button>
      </div>
    </div>

    <script>
const socket = io();
let ROOM = "";
let PID = localStorage.getItem("scramble_pid") || (Date.now()+"_"+Math.random().toString(16).slice(2));
localStorage.setItem("scramble_pid", PID);
let isHost = false;
let lastState = null;
function closeWinner(){
  document.getElementById("winnerScreen").style.display = "none";
  document.getElementById("winnerScreen").classList.add("hidden");
}
      
const categoryNames = {
  general:"كلمات عامة",
  countries:"دول",
  football:"لاعبين كرة",
  movies:"أفلام",
  anime:"شخصيات أنمي",
  famous:"مشاهير",
  brands:"شركات وماركات",
  games:"ألعاب",
  cars:"سيارات",
  animals:"حيوانات"
};

function joinGame(){
  ROOM = document.getElementById("room").value.trim().toUpperCase() || "ROOM1";
  const name = document.getElementById("name").value.trim() || "لاعب";
  const avatar = document.getElementById("avatar").value.trim() || "🎮";
  socket.emit("scramble_join", {room:ROOM, name, avatar, pid:PID});
  document.getElementById("joinBox").classList.add("hidden");
  document.getElementById("gameBox").classList.remove("hidden");
  document.getElementById("roomTitle").innerText = ROOM;
}

function startGame(){
  socket.emit("scramble_start", {
    room:ROOM,
    startPoints:document.getElementById("startPoints").value,
    timeLimit:document.getElementById("timeLimit").value,
    roundMode:document.getElementById("roundMode").value,
    roundLimit:document.getElementById("roundLimit").value,
    autoDelay:document.getElementById("autoDelay").value,
    wordCategory:document.getElementById("wordCategory").value
});
}

function nextRound(){
  socket.emit("scramble_next_round", {room:ROOM});
}

function resetGame(){
  socket.emit("scramble_reset", {room:ROOM});
}

function sendAnswer(){
  const answer = document.getElementById("answer").value.trim();
  if(!answer) return;
  socket.emit("scramble_answer", {room:ROOM, pid:PID, answer});
  document.getElementById("answer").value = "";
}

function steal(targetPid){
  socket.emit("scramble_steal", {room:ROOM, pid:PID, targetPid});
}

function kickPlayer(targetPid){
  if(!confirm("طرد اللاعب؟")) return;
  socket.emit("scramble_kick", {room: ROOM, targetPid: targetPid});
}

function leaveGame(){
  socket.emit("scramble_leave", {room: ROOM, pid: PID});
  window.location.href = "/";
}
socket.on("scramble_state", (s)=>{
  lastState = s;
  isHost = s.players.some(p => p.pid === PID && p.isHost);

  document.getElementById("hostBox").classList.toggle("hidden", !isHost);
  document.getElementById("message").innerText = s.gameOver ? ("🏆 الفائز: " + s.finalWinner) : (s.message || "");
  document.getElementById("timer").innerText = s.timeLeft || 0;
  document.getElementById("scrambled").innerText = s.scrambled || "---";

  const answerBox = document.getElementById("correctAnswerBox");

  if (s.showAnswer) {
    answerBox.style.display = "block";
    answerBox.innerHTML = "✅ الإجابة الصحيحة: " + s.correctAnswer;
  } else {
    answerBox.style.display = "none";
  }

  document.getElementById("categoryTitle").innerText = categoryNames[s.wordCategory] || s.wordCategory || "---";
  document.getElementById("roundTitle").innerText = s.round || 0;
  const playersBox = document.getElementById("players");
  playersBox.innerHTML = "";

  s.players.forEach(p=>{
    const div = document.createElement("div");
    div.className = "player" + (!p.alive ? " dead" : "") + (p.pid===PID ? " me" : "");
    const badges = `
      ${p.isHost ? '<span class="badge">👑 قائد</span>' : ''}
      ${p.shield > 0 ? '<span class="badge">🛡️ درع</span>' : ''}
      ${p.revenge ? '<span class="badge">🔥 انتقام</span>' : ''}
      ${p.winStreak > 0 ? `<span class="badge">سلسلة ${p.winStreak}/3</span>` : ''}
    `;
    div.innerHTML = `
      <div style="font-size:30px">${p.avatar}</div>
      <b>${p.name}</b>
      <br>
      ${badges}
      <br>
      النقاط: <b>${p.points}</b>
      ${isHost && p.pid !== PID ? `<br><button class="danger" onclick="kickPlayer('${p.pid}')">🚫 طرد</button>` : ''}
    `;
    playersBox.appendChild(div);
  });

  const canSteal = s.mustSteal && (String(s.winnerPid) === String(PID) || isHost);
  document.getElementById("stealBox").classList.toggle("hidden", !canSteal);

  const stealTitle = document.getElementById("stealTitle");
  if(canSteal){
    stealTitle.innerText = String(s.winnerPid) === String(PID)
      ? "اختر لاعب تسرق منه نقطة"
      : "القائد يختار بدلاً من الفائز";
  }

  const targets = document.getElementById("stealTargets");
  targets.innerHTML = "";

  if(canSteal){
    const winnerPid = String(s.winnerPid);
    const winner = s.players.find(p => String(p.pid) === winnerPid);

    s.players
      .filter(p => String(p.pid) !== winnerPid && p.alive && Number(p.points) > 0)
      .forEach(p=>{
        const btn = document.createElement("button");
        let note = "";

        if(s.round && Number(s.round) % 5 === 0) note += " 🔥x2";
        if(winner && String(winner.revenge || "") === String(p.pid)) note += " انتقامx2";
        if(Number(p.shield || 0) > 0) note += " 🛡️";

        btn.innerText = `${p.avatar} ${p.name} - ${p.points}${note}`;
        btn.onclick = ()=>steal(p.pid);
        targets.appendChild(btn);
      });
  }

  if(s.gameOver){
    document.getElementById("winnerScreen").classList.remove("hidden");
    document.getElementById("winnerScreen").style.display = "flex";

    document.getElementById("winnerName").innerText =
      s.finalWinner || "لا يوجد فائز";

    const box = document.getElementById("finalScores");
    box.innerHTML = "";

    (s.finalScores || []).forEach((p, i)=>{
      box.innerHTML += `
        <div style="
          background:#222;
          margin:8px;
          padding:12px;
          border-radius:12px;
          font-size:22px">
          ${i+1}️⃣ ${p.avatar}
          <b>${p.name}</b>
          — ${p.points} نقطة
        </div>
      `;
    });
  }

});

socket.on("scramble_error", (e)=> alert(e.message || "خطأ"));
socket.on("scramble_kicked", ()=>{
  alert("تم طردك من الغرفة");
  window.location.href = "/";
});
socket.on("scramble_left", ()=>{});
</script>
</body>
</html>
