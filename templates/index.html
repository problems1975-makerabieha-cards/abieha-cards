<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO أبيها - النهائي</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--gold:#ffd166;--dark:#050b18;--panel:rgba(6,18,42,.78)}
body{margin:0;min-height:100vh;font-family:Arial,Tahoma,sans-serif;color:white;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(70,140,255,.28),transparent 35%),linear-gradient(180deg,#0c234a,#050b18 75%)}
main{max-width:1320px;margin:auto;padding:clamp(8px,2vw,16px)}
h1{margin:8px 0 10px;text-shadow:0 4px 10px #000;font-size:clamp(22px,5vw,36px)}
.join,.controls,.logBox{background:linear-gradient(135deg,rgba(22,53,105,.95),rgba(7,17,38,.95));border:1px solid rgba(120,190,255,.25);border-radius:24px;padding:12px;margin-bottom:14px;box-shadow:0 18px 55px #0008}
input,select{border:0;border-radius:14px;padding:12px 14px;margin:6px;font-size:16px;min-width:160px}
button{border:0;border-radius:15px;padding:12px 18px;margin:6px;font-weight:900;cursor:pointer;color:#071126;background:linear-gradient(180deg,#fff0a6,#ffd166);box-shadow:0 7px 0 #9b6a00,0 12px 22px #0008}
button:active{transform:translateY(4px);box-shadow:0 3px 0 #9b6a00}
.green{background:linear-gradient(180deg,#7affb2,#35dd7b);box-shadow:0 7px 0 #0b7d3b,0 12px 22px #0008}
.blueBtn{background:linear-gradient(180deg,#79c6ff,#2f80ff);color:white;box-shadow:0 7px 0 #06449d,0 12px 22px #0008}
.redBtn{background:linear-gradient(180deg,#ff8aa0,#ff4d6d);color:white;box-shadow:0 7px 0 #a50d28,0 12px 22px #0008}
.hidden{display:none!important}
.avatarSelectWrap{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:4px 8px;margin:6px}
#avatarInput{min-width:86px;font-size:22px;padding:8px 10px;margin:0}

/* ===== ARENA ===== */
.arena{position:relative;min-height:780px;border-radius:clamp(20px,4vw,34px);overflow:visible;padding:clamp(10px,2vw,22px);padding-bottom:260px;background:radial-gradient(circle at 50% 42%,rgba(68,140,255,.20),transparent 43%),linear-gradient(135deg,rgba(20,55,105,.8),rgba(5,10,24,.97));border:1px solid rgba(120,190,255,.26);box-shadow:inset 0 0 120px #0009,0 26px 85px #000b}
.table{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);width:min(90vw,1040px);height:clamp(430px,58vh,570px);border-radius:50%;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.28)),url('/static/bg-table.png') center/contain no-repeat,#050505;border:clamp(5px,1.3vw,10px) solid rgba(255,255,255,.12);box-shadow:inset 0 0 70px rgba(0,0,0,.55),0 0 0 6px rgba(76,201,240,.15),0 35px 85px #000c}
.tableInfo{position:relative;z-index:2;height:100%;display:grid;place-items:center}.info{position:relative;min-width:0;padding:0;background:transparent;border:0;box-shadow:none}
#timeText{font-size:13px;opacity:.92;margin-bottom:12px;position:relative;z-index:40}#penaltyLine{font-size:14px;min-height:18px;margin:0 0 6px;color:#fff;text-shadow:0 3px 8px #000;position:relative;z-index:40}

/* ===== CENTER PLAY ===== */
.centerPlayArea{position:relative;display:flex;align-items:center;justify-content:center;gap:0;width:280px;height:260px;margin:auto}
#top{display:flex;justify-content:center;align-items:center;position:relative;z-index:25}
#top .card{width:125px;height:185px;font-size:54px;transform:rotate(-7deg);z-index:25}#top .card .mark{font-size:58px}
.drawOutsideBtn{position:absolute;right:-118px;top:50%;transform:translateY(-50%) rotate(-7deg);width:108px;height:72px;font-size:20px;z-index:80;display:flex;align-items:center;justify-content:center;border:3px solid #fff3b0;box-shadow:0 0 22px rgba(255,209,102,.9),0 8px 0 #9b6a00,0 14px 24px #0008}
.ovalInfo{position:absolute;left:-150px;top:50%;transform:translateY(-50%);width:176px;min-height:78px;border-radius:18px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.7);display:flex;flex-direction:column;justify-content:center;text-align:center;font-weight:900;z-index:80}

/* ===== CARDS ===== */
.card{display:inline-flex;align-items:center;justify-content:center;position:relative;width:76px;height:112px;border-radius:19px;margin:4px;font-size:28px;font-weight:900;cursor:pointer;border:4px solid #fff8e8;box-shadow:0 10px 18px #0009;overflow:hidden;transition:.14s;isolation:isolate}.card:hover{filter:brightness(1.08)}
.red{background:linear-gradient(145deg,#ff4b66,#aa071b)}.bluec{background:linear-gradient(145deg,#45b6ff,#064dbb)}.greenc{background:linear-gradient(145deg,#46ee91,#04783a)}.yellow{background:linear-gradient(145deg,#ffe56a,#d69000);color:#1b1600}.black{background:linear-gradient(145deg,#333,#050505)}
.card::before{content:"";position:absolute;right:7%;top:6%;width:30%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22);box-shadow:0 2px 8px #0009;border:1px solid rgba(255,255,255,.55);z-index:1}.card::after{content:"أبيها";position:absolute;left:8%;bottom:6%;font-size:13px;letter-spacing:.3px;opacity:.95;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.33);border:1px solid rgba(255,255,255,.22);z-index:2}
.card .mark{position:absolute;top:53%;left:50%;transform:translate(-50%,-50%);font-size:34px;text-shadow:0 3px 8px #000;z-index:3;font-family:Arial,Tahoma,sans-serif;font-weight:900}.card .skullBig{position:absolute;top:20%;left:50%;transform:translateX(-50%);font-size:58px;opacity:.18;z-index:0;filter:drop-shadow(0 4px 8px #000)}
.cornerNum{position:absolute;right:7%;top:6%;width:30%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;text-shadow:0 2px 5px #000;z-index:8;pointer-events:none;line-height:1}.hand .cornerNum{font-size:16px}#top .cornerNum{font-size:22px}

/* ===== SEATS ===== */
.seat{position:absolute;width:118px;min-height:70px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:7px;border-radius:18px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18);box-shadow:none;overflow:hidden;z-index:10}.seat.active{outline:4px solid var(--gold);box-shadow:0 0 35px rgba(255,209,102,.9)}
.s1{right:5%;top:48%;bottom:auto}.s2{right:8%;top:12%}.s3{left:50%;top:4%;transform:translateX(-50%)}.s4{left:8%;top:12%}.s5{left:5%;top:48%;bottom:auto}
.playerName{font-weight:900;font-size:clamp(12px,2.2vw,17px);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 5px #000}.playerMeta{font-size:clamp(10px,1.8vw,13px);opacity:.9;line-height:1.35}.playerCards{font-weight:900;color:var(--gold)}.playerScore{margin-top:3px;color:#ffd166;font-weight:900;font-size:clamp(10px,1.8vw,13px);text-shadow:0 0 8px #000,0 0 10px rgba(255,209,102,.35)}.playerScore.danger{color:#ff4d6d;animation:scorePulse .9s infinite ease-in-out}@keyframes scorePulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.25)}}.seat.empty{opacity:.22}
.avatarBadge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.35),rgba(255,209,102,.20) 45%,rgba(0,0,0,.45));border:2px solid rgba(255,255,255,.75);box-shadow:0 0 14px rgba(255,209,102,.45),0 8px 18px #0009;margin-bottom:3px;line-height:1}.seat.active .avatarBadge{animation:avatarBounce 1.05s infinite ease-in-out}@keyframes avatarBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.08)}}

/* ===== MY HAND ===== */
.seat.s0.me{
  left:50%;
  bottom:-30px;
  transform:translateX(-50%);
  width:100%;
  max-width:100vw;
  min-height:255px;
  background:transparent;
  border:0;
  box-shadow:none;
  z-index:5; /* 👈 أهم تعديل */
  overflow:hidden;
  padding-inline:12px;
}
.seat.s0.me .hand{width:100%;max-width:100%;min-height:205px;display:flex;align-items:flex-end;justify-content:flex-start;overflow-x:auto;overflow-y:visible;background:transparent;border:0;padding:30px 18px 35px;gap:0;transform:none;scrollbar-width:thin;white-space:nowrap}.seat.s0.me .hand .card{flex:0 0 auto;width:78px;height:116px;margin-left:-12px;transform-origin:bottom center;transition:transform .18s ease,filter .18s ease}.seat.s0.me .hand .card:first-child{margin-left:0}.seat.s0.me .hand .card:nth-child(odd){transform:rotate(-7deg) translateY(6px)}.seat.s0.me .hand .card:nth-child(even){transform:rotate(7deg) translateY(6px)}.seat.s0.me .hand .card:hover{transform:translateY(-22px) scale(1.08)!important;z-index:99;filter:brightness(1.12)}

/* ===== CHAT ===== */
.logBox{
  margin-top:16px;
  padding:14px;
}

.log{
  height:clamp(260px,32vh,390px);
  overflow:auto;
  background:rgba(0,0,0,.56);
  border-radius:24px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:8px;
  text-align:right;
  border:1px solid rgba(120,190,255,.18);
  box-shadow:inset 0 0 38px rgba(0,0,0,.35);
}

.chatMsg{
  width:fit-content;
  max-width:min(86%,720px);
  display:flex;
  gap:7px;
  align-items:center;
  animation:chatPop .16s ease-out;
}

@keyframes chatPop{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}
.chatLine{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:4px;
  font-weight:700;
}

.chatAvatar{
  font-size:16px;
}

.chatName{
  font-weight:900;
}

.chatText{
  color:#fff;
  font-weight:500;
}

.logLine{
  color:#aaa;
  font-size:13px;
}
.chatMe{
  align-self:flex-end;
  flex-direction:row-reverse;
}

.chatOther{
  align-self:flex-start;
}

/* بدل فقاعة الرسائل: إيموجي اللاعب فقط */
.chatAvatar{
  width:auto;
  height:auto;
  min-width:24px;
  display:inline-grid;
  place-items:center;
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  font-size:22px;
  line-height:1;
  flex:0 0 auto;
  filter:drop-shadow(0 3px 6px #000);
}

.chatBubble{
  padding:6px 10px;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
  line-height:1.45;
  word-break:break-word;
  box-shadow:none;
  background:rgba(5,13,30,.52);
  color:white;
  border:1px solid rgba(255,255,255,.08);
  border-inline-start:4px solid var(--playerColor,#ffd166);
}

.chatMe .chatBubble,
.chatOther .chatBubble{
  background:rgba(5,13,30,.52);
  color:white;
  border-bottom-left-radius:10px;
  border-bottom-right-radius:10px;
}

.chatName{
  color:var(--playerColor,#ffd166);
  font-weight:900;
  margin-left:5px;
  text-shadow:0 2px 5px #000;
  white-space:nowrap;
}

.chatText{
  color:#fff;
  font-weight:600;
}

.sysMsg{
  align-self:center;
  background:rgba(255,209,102,.10);
  color:#ffd166;
  border:1px solid rgba(255,209,102,.32);
  border-radius:999px;
  padding:5px 10px;
  font-weight:900;
  font-size:12px;
}

.chatInputRow{
  display:flex;
  gap:8px;
  margin-top:10px;
  align-items:center;
}

#chatInput{
  flex:1;
  min-width:0;
  font-size:14px;
  padding:12px 14px;
}

.chatSendBtn{
  min-width:74px;
  padding:11px 14px;
}

/* ===== COLOR PICKER FOR BLACK CARDS ===== */
#colorPicker{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.72);
  z-index:3000;
  padding:18px;
}
#colorPicker.show{display:grid}
.pickerBox{
  display:grid;
  grid-template-columns:repeat(2, minmax(96px, 130px));
  gap:16px;
  padding:22px;
  border-radius:26px;
  background:linear-gradient(135deg,rgba(22,53,105,.98),rgba(5,10,24,.98));
  border:2px solid var(--gold);
  box-shadow:0 0 45px rgba(255,209,102,.35),0 25px 80px #000;
}
.pickerBox::before{
  content:"اختر اللون";
  grid-column:1/-1;
  color:var(--gold);
  font-weight:900;
  font-size:22px;
  margin-bottom:4px;
}
.pickerBox button{
  width:100%;
  height:86px;
  border:4px solid rgba(255,255,255,.9);
  border-radius:22px;
  box-shadow:0 9px 0 rgba(0,0,0,.35),0 16px 28px #0009;
}
.pickerBox button:active{transform:translateY(4px)}
@media(max-width:520px){
  .pickerBox{grid-template-columns:repeat(2, minmax(82px, 1fr));gap:12px;width:min(92vw,330px);padding:18px}
  .pickerBox button{height:74px}
}


/* ===== SPECTATORS ===== */
.spectatorsBox{
  margin-top:10px;
  padding:10px;
  border-radius:18px;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.10);
  text-align:right;
}
.spectatorsTitle{font-weight:900;color:var(--gold);margin-bottom:8px}
.spectatorChip{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:5px 8px;margin:4px;font-weight:800;font-size:12px;
}
.spectatorChip button{padding:4px 8px;margin:0;border-radius:999px;font-size:11px;box-shadow:none}
.spectatorNote{color:#ffd166;font-size:13px;font-weight:900;margin:6px 0}


.sitChoices{
  width:100%;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding:10px;
}
.sitChoices .spectatorNote{
  width:100%;
  color:#ffd166;
  font-weight:900;
  margin-bottom:4px;
}
.sitChoices button{
  padding:8px 10px;
  font-size:12px;
  border-radius:12px;
}

/* ===== FINAL RESULTS ===== */
.finalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;place-items:center;z-index:2000;padding:16px}
.finalOverlay.show{display:grid}
.finalBox{width:min(92vw,620px);background:linear-gradient(135deg,rgba(22,53,105,.98),rgba(5,10,24,.98));border:2px solid var(--gold);border-radius:28px;padding:22px;box-shadow:0 0 50px rgba(255,209,102,.35),0 30px 90px #000;color:#fff;text-align:center}
.finalBox h2{margin:0 0 12px;font-size:clamp(24px,5vw,36px);color:var(--gold);text-shadow:0 3px 10px #000}
.finalWinner{font-size:clamp(20px,4vw,30px);font-weight:900;margin:10px 0 16px;color:#7affb2;text-shadow:0 0 12px rgba(122,255,178,.5)}
.finalTable{width:100%;border-collapse:collapse;margin-top:12px;overflow:hidden;border-radius:14px}
.finalTable th,.finalTable td{padding:10px;border-bottom:1px solid rgba(255,255,255,.14);font-weight:900}
.finalTable th{color:#071126;background:linear-gradient(180deg,#fff0a6,#ffd166)}
.finalLoser{color:#ff6b83}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){.arena{min-height:730px;padding-bottom:245px}.table{width:92vw;height:440px}.seat.s0.me .hand .card{width:70px;height:104px;margin-left:-10px}.drawOutsideBtn{right:-92px;width:88px;height:60px;font-size:17px}.ovalInfo{left:-118px;width:138px;font-size:13px}}
@media(max-width:760px){input,select{min-width:128px;font-size:14px;padding:10px}button{padding:10px 12px;margin:4px;border-radius:13px}.join,.controls,.logBox{border-radius:18px;padding:8px}.arena{min-height:690px;padding-bottom:225px}.table{top:38%;width:96vw;height:370px}.centerPlayArea{width:220px;height:210px}#top .card{width:95px;height:142px}.drawOutsideBtn{right:-66px;width:66px;height:48px;font-size:14px}.ovalInfo{left:-82px;width:110px;min-height:60px;font-size:11px}.seat:not(.me){width:88px;min-height:58px;font-size:11px}.s1{right:2%;top:50%}.s2{right:4%;top:13%}.s3{top:1%}.s4{left:4%;top:13%}.s5{left:2%;top:50%}.seat.s0.me{bottom:-15px;min-height:230px}.seat.s0.me .hand{padding-inline:12px}.seat.s0.me .hand .card{width:62px;height:94px;margin-left:-8px}.avatarBadge{width:34px;height:34px;font-size:21px}.seat.s0.me .avatarBadge{width:30px;height:30px;font-size:20px}.log{height:250px}.chatBubble{font-size:12px;padding:5px 9px}.chatAvatar{font-size:20px}#chatInput{font-size:13px;padding:10px 12px}.chatSendBtn{min-width:66px;padding:10px 11px}}
@media(max-width:480px){.arena{min-height:650px;padding-bottom:205px}.table{width:96vw;height:350px}.centerPlayArea{width:190px;height:190px}#top .card{width:86px;height:128px}.seat:not(.me){width:76px;min-height:52px}.seat.s0.me .hand .card{width:58px;height:88px;margin-left:-8px}#avatarInput{min-width:76px;font-size:20px}.log{height:220px;padding:12px}.chatMsg{max-width:94%}.chatBubble{font-size:11.8px;line-height:1.4}.chatInputRow{gap:5px}.chatSendBtn{min-width:58px;font-size:12px;padding:9px}}
/* ===== HOST CONTROL PANEL ===== */
.hostPanel{
  margin-top:12px;
  padding:14px;
  border-radius:22px;
  background:linear-gradient(135deg,rgba(17,24,39,.96),rgba(2,6,23,.98));
  border:1px solid rgba(255,209,102,.35);
  box-shadow:0 0 30px rgba(255,209,102,.18), inset 0 0 28px rgba(0,0,0,.25);
  color:white;
  text-align:right;
}
.hostTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:18px;
  font-weight:900;
  color:var(--gold);
  margin-bottom:10px;
  text-shadow:0 2px 8px #000;
}
.hostSubTitle{
  font-size:13px;
  color:#b9d7ff;
  font-weight:800;
  margin:10px 0 6px;
}
.hostRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:9px;
  margin:7px 0;
  border-radius:16px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.09);
}
.hostName{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  font-weight:900;
}
.hostName span.nameTxt{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.badgeHost,.badgeDeputy{
  display:inline-flex;
  align-items:center;
  padding:3px 7px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap;
}
.badgeHost{
  color:#071126;
  background:linear-gradient(180deg,#fff0a6,#ffd166);
}
.badgeDeputy{
  color:white;
  background:linear-gradient(180deg,#c084fc,#7c3aed);
}
.hostBtns{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:5px;
}
.hostBtns button{
  margin:0;
  padding:7px 9px;
  border-radius:11px;
  font-size:12px;
  box-shadow:none;
  color:white;
}
.hostBtns .btnDeputy{background:linear-gradient(180deg,#c084fc,#7c3aed)}
.hostBtns .btnHost{background:linear-gradient(180deg,#ffd166,#f59e0b);color:#071126}
.hostBtns .btnKick{background:linear-gradient(180deg,#ff8aa0,#dc2626)}
@media(max-width:640px){
  .hostRow{align-items:stretch;flex-direction:column}
  .hostBtns{justify-content:flex-start}
  .hostBtns button{font-size:11px;padding:7px 8px}
}

</style>
</head>
<body>
<main>
<h1>UNO أبيها - النهائي</h1>

<div class="join" id="joinBox">
  <input id="nameInput" placeholder="اسم اللاعب">
  <span class="avatarSelectWrap">🎭 <select id="avatarInput" title="اختر شخصيتك الكوميدية">
    <option value="auto">تلقائي</option><option value="🤡">🤡</option><option value="😂">😂</option><option value="😈">😈</option><option value="🤖">🤖</option><option value="👽">👽</option><option value="🐸">🐸</option><option value="🐵">🐵</option><option value="🐔">🐔</option><option value="💀">💀</option><option value="🧠">🧠</option><option value="🥸">🥸</option><option value="👻">👻</option>
  </select></span>

  <input id="roomInput" value="ROOM1">
  <select id="modeInput" onchange="toggleTeamOptions()"><option value="solo">فردي</option><option value="teams">جماعي</option></select>
  <select id="teamModeInput" class="teamOnly hidden" onchange="toggleTeamOptions()"><option value="auto">تلقائي</option><option value="manual">يدوي</option></select>
  <select id="teamCountInput" class="teamOnly hidden"><option value="2">فريقين</option><option value="3">3 فرق</option></select>
  <select id="teamInput" class="manualOnly hidden"><option value="A">أزرق</option><option value="B">برتقالي</option><option value="C">بنفسجي</option></select>
  <button class="green" onclick="joinGame()">دخول</button>
</div>

<div class="controls hidden" id="controls">
  <span class="timerSetup">⏱️ وقت اللاعب قبل البداية: <select id="timeLimitInput"><option value="10">10 ثواني</option><option value="15">15 ثانية</option><option value="20">20 ثانية</option><option value="30" selected>30 ثانية</option><option value="45">45 ثانية</option><option value="60">60 ثانية</option><option value="90">90 ثانية</option><option value="120">120 ثانية</option></select></span>
  <span class="timerSetup">🎯 سكور اللعبة: <select id="scoreLimitInput"><option value="200">200</option><option value="300">300</option><option value="400">400</option><option value="500" selected>500</option></select></span>
  <button class="blueBtn" onclick="startGame()">ابدأ</button><button onclick="lastCard()">كرت أخير</button><button class="redBtn" onclick="endGame()">إنهاء اللعبة</button><button onclick="leaveGame()">رجوع / خروج من الغرفة</button>
</div>

<section class="arena hidden" id="arena">
  <div id="timerBar"></div>
  <div class="table"><div class="tableInfo"><div class="info"><h3 id="penaltyLine"></h3><div id="timeText"></div><div class="centerPlayArea"><div id="top"></div><button class="drawOutsideBtn" onclick="drawCard()">اسحب</button><div class="ovalInfo"><div id="turn">-</div><div id="need">-</div></div></div></div></div></div>
  <div class="seat s0 me" id="seat0"><div id="hand" class="hand"></div></div>
  <div class="seat s1" id="seat1"></div><div class="seat s2" id="seat2"></div><div class="seat s3" id="seat3"></div><div class="seat s4" id="seat4"></div><div class="seat s5" id="seat5"></div>
</section>

<section class="logBox hidden" id="logBox">
  <div id="log" class="log"></div>
  <div id="spectatorsBox" class="spectatorsBox hidden"></div>
  <div class="chatInputRow">
    <input id="chatInput" placeholder="اكتب رسالة...">
    <button class="chatSendBtn" onclick="sendChat()">إرسال</button>
  </div>
</section>

<div id="colorPicker"><div class="pickerBox"><button style="background:red" onclick="chooseColor('red')"></button><button style="background:blue" onclick="chooseColor('bluec')"></button><button style="background:green" onclick="chooseColor('greenc')"></button><button style="background:gold" onclick="chooseColor('yellow')"></button></div></div>

<div id="finalOverlay" class="finalOverlay"><div class="finalBox"><h2>🏆 النتيجة النهائية</h2><div id="finalWinner" class="finalWinner"></div><div id="finalLosers"></div><table class="finalTable"><thead><tr><th>اللاعب</th><th>النقاط</th><th>الجولات</th></tr></thead><tbody id="finalRows"></tbody></table><button class="blueBtn" onclick="closeFinalOverlay()">إغلاق</button></div></div>

<script>
const socket = io();
let roomCode = "";
let myId = null;
let state = null;
let selectedIndex = null;
let selectedAvatar = "auto";
let myRole = "spectator";

const COMEDY_AVATARS = ["🤡","😂","😈","🤖","👽","🐸","🐵","🐔","💀","🧠","🥸","👻","🦖","🦄"];

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function simpleHash(str){
  let h = 0;
  str = String(str || "");
  for(let i=0; i<str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function avatarForPlayer(p){
  if(!p) return "🤡";
  if(p.avatar && p.avatar !== "auto") return p.avatar;
  if(p.id === myId && selectedAvatar && selectedAvatar !== "auto") return selectedAvatar;
  return COMEDY_AVATARS[simpleHash((p.id || "") + (p.name || "")) % COMEDY_AVATARS.length];
}

function avatarHtml(p){
  return `<div class="avatarBadge" title="شخصية اللاعب">${avatarForPlayer(p)}</div>`;
}

function isSpectator(){
  return (state?.role || myRole) === "spectator";
}

function toggleTeamOptions(){
  const mode = document.getElementById("modeInput")?.value || "solo";
  const teamMode = document.getElementById("teamModeInput")?.value || "auto";
  document.querySelectorAll(".teamOnly").forEach(x => x.classList.toggle("hidden", mode !== "teams"));
  document.querySelectorAll(".manualOnly").forEach(x => x.classList.toggle("hidden", !(mode === "teams" && teamMode === "manual")));
}

function joinGame(){
  const nameInput = document.getElementById("nameInput");
  const name = (nameInput?.value || "لاعب").trim() || "لاعب";
  selectedAvatar = document.getElementById("avatarInput")?.value || "auto";
  roomCode = (document.getElementById("roomInput")?.value || "ROOM1").trim().toUpperCase();

  const mode = document.getElementById("modeInput")?.value || "solo";
  const teamMode = document.getElementById("teamModeInput")?.value || "auto";
  const teamCount = document.getElementById("teamCountInput")?.value || "2";
  const team = document.getElementById("teamInput")?.value || "A";

  socket.emit("join", {
    name,
    room: roomCode,
    mode,
    teamMode,
    teamCount,
    team,
    avatar: selectedAvatar,
    role: "spectator"
  });
}

function sitAtSeat(seat){
  socket.emit("sit_seat", {room: roomCode, playerId: myId, seat});
}

function sendChat(){
  const input = document.getElementById("chatInput");
  const text = (input?.value || "").trim();
  if(!text) return;
  socket.emit("chat", {room: roomCode, playerId: myId, text});
  input.value = "";
}

function kickPlayer(targetId){
  if(!confirm("تأكيد طرد هذا الشخص من الغرفة؟")) return;
  socket.emit("kick_player", {room: roomCode, hostId: myId, targetId});
}

function isHost(){
  return !!(state && myId && (state.host === myId || state.hostId === myId));
}

function toggleDeputy(targetId){
  if(!isHost()) return alert("فقط القائد يقدر يعيّن نائب");
  socket.emit("toggle_trusted_host", {room: roomCode, hostId: myId, targetId});
}

function makeHost(targetId){
  if(!isHost()) return alert("فقط القائد يقدر ينقل القيادة");
  if(!confirm("تنقل القيادة لهذا اللاعب؟")) return;
  socket.emit("make_host", {room: roomCode, hostId: myId, targetId});
}

function renderHostPanel(){
  const old = document.getElementById("hostPanel");
  if(old) old.remove();

  if(!state || !isHost()) return;

  const players = state.players || [];
  const spectators = state.spectators || [];
  const trusted = state.trustedHosts || [];

  const box = document.createElement("div");
  box.id = "hostPanel";
  box.className = "hostPanel";

  let html = `
    <div class="hostTitle">
      <span>👑 لوحة تحكم القائد</span>
      <span style="font-size:12px;color:#93c5fd">الغرفة: ${escapeHTML(state.room || roomCode || "-")}</span>
    </div>
    <div class="hostSubTitle">🎮 اللاعبين</div>
  `;

  html += players.map(p => {
    const isMeHost = p.id === myId;
    const isDeputy = trusted.includes(p.id);
    const avatar = avatarForPlayer(p);

    if(isMeHost){
      return `
        <div class="hostRow">
          <div class="hostName">
            <span>${avatar}</span>
            <span class="nameTxt">${escapeHTML(p.name || "لاعب")}</span>
            <span class="badgeHost">القائد</span>
          </div>
        </div>
      `;
    }

    return `
      <div class="hostRow">
        <div class="hostName">
          <span>${avatar}</span>
          <span class="nameTxt">${escapeHTML(p.name || "لاعب")}</span>
          ${isDeputy ? `<span class="badgeDeputy">⭐ نائب</span>` : ``}
        </div>
        <div class="hostBtns">
          <button class="btnDeputy" onclick="toggleDeputy('${p.id}')">${isDeputy ? "إلغاء نائب" : "تعيين نائب"}</button>
          <button class="btnHost" onclick="makeHost('${p.id}')">نقل القيادة</button>
          <button class="btnKick" onclick="kickPlayer('${p.id}')">طرد</button>
        </div>
      </div>
    `;
  }).join("");

  if(spectators.length){
    html += `<div class="hostSubTitle">👀 المشاهدين</div>`;
    html += spectators.map(s => {
      const avatar = (s.avatar && s.avatar !== "auto") ? s.avatar : "👀";
      return `
        <div class="hostRow">
          <div class="hostName">
            <span>${avatar}</span>
            <span class="nameTxt">${escapeHTML(s.name || "مشاهد")}</span>
          </div>
          <div class="hostBtns">
            <button class="btnKick" onclick="kickPlayer('${s.id}')">طرد المشاهد</button>
          </div>
        </div>
      `;
    }).join("");
  }

  box.innerHTML = html;

  const target = document.getElementById("spectatorsBox") || document.getElementById("logBox") || document.body;
  target.insertAdjacentElement("afterend", box);
}

function startGame(){
  if(isSpectator()) return alert("اختر مقعد أولاً حتى تصبح لاعب");
  const timeLimit = parseInt(document.getElementById("timeLimitInput")?.value || "30", 10);
  const scoreLimit = parseInt(document.getElementById("scoreLimitInput")?.value || "500", 10);
  socket.emit("start", {room: roomCode, playerId: myId, timeLimit, scoreLimit});
}

function drawCard(){
  if(isSpectator()) return alert("أنت مشاهد فقط");
  socket.emit("draw", {room: roomCode, playerId: myId});
}

function lastCard(){
  if(isSpectator()) return alert("أنت مشاهد فقط");
  socket.emit("last_card", {room: roomCode, playerId: myId});
}

function endGame(){
  socket.emit("end_game", {room: roomCode, playerId: myId});
}

function leaveGame(){
  socket.emit("leave_room", {room: roomCode, playerId: myId});
}

function isBlackCard(card){
  return card && (card.c === "black" || card.n === "+4" || card.n === "لون" || card.n === "تبديل");
}

function playCard(i){
  if(isSpectator()) return alert("أنت مشاهد فقط");
  if(!state || !state.myHand) return;
  const card = state.myHand[i];
  if(!card) return;

  if(isBlackCard(card)){
    selectedIndex = i;
    document.getElementById("colorPicker")?.classList.add("show");
    return;
  }

  socket.emit("play", {room: roomCode, playerId: myId, index: i});
}

function chooseColor(color){
  if(selectedIndex === null || selectedIndex === undefined) return;
  socket.emit("play", {room: roomCode, playerId: myId, index: selectedIndex, color});
  selectedIndex = null;
  document.getElementById("colorPicker")?.classList.remove("show");
}

function cardSymbol(n){
  if(n === "عكس") return "↺";
  if(n === "تخطي") return "⊘";
  if(n === "تبديل") return "⇄";
  return n;
}

function cardValueOrder(n){
  const v = parseInt(n, 10);
  if(!Number.isNaN(v)) return v;
  if(n === "تخطي") return 10;
  if(n === "عكس") return 11;
  if(n === "+2") return 12;
  if(n === "+4") return 13;
  if(n === "لون") return 14;
  if(n === "تبديل") return 15;
  return 99;
}

function colorOrder(c){
  return ({bluec:1, yellow:2, red:3, greenc:4, black:5})[c] || 99;
}

function sortedHandWithIndex(hand){
  return (hand || [])
    .map((c, i) => ({...c, realIndex:i}))
    .sort((a,b) => {
      const ca = colorOrder(a.c), cb = colorOrder(b.c);
      if(ca !== cb) return ca - cb;
      return cardValueOrder(a.n) - cardValueOrder(b.n);
    });
}

function cardHtml(c){
  const symbol = cardSymbol(c.n);
  return `<div class="card ${c.c}" onclick="playCard(${c.realIndex})">
    <span class="cornerNum">${symbol}</span>
    <span class="skullBig">☠</span>
    <span class="mark">${symbol}</span>
  </div>`;
}

function tableCardHtml(c){
  const symbol = cardSymbol(c.n);
  return `<div class="card ${c.c}">
    <span class="cornerNum">${symbol}</span>
    <span class="skullBig">☠</span>
    <span class="mark">${symbol}</span>
  </div>`;
}

function scoreHtml(p){
  const score = Number(p?.score || 0);
  const limit = Number(state?.scoreLimit || 500);
  const cls = score >= Math.max(0, limit - 50) ? "playerScore danger" : "playerScore";
  return `<div class="${cls}">النقاط: ${score} / ${limit}</div>`;
}

function getPlayerColor(id){
  const colors = ["#ff4b4b", "#4bd0ff", "#4bff88", "#ffd84b", "#c04bff", "#ff8c4b", "#55efc4", "#ff77e9"];
  const allPeople = [...(state?.players || []), ...(state?.spectators || [])];
  const index = allPeople.findIndex(p => p.id === id);
  if(index === -1) return "#aaa";
  return colors[index % colors.length];
}

function closeFinalOverlay(){
  document.getElementById("finalOverlay")?.classList.remove("show");
}

function renderFinalResults(){
  const overlay = document.getElementById("finalOverlay");
  if(!overlay || !state) return;
  const fr = state.finalResults;
  if(!state.gameOver || !fr){
    overlay.classList.remove("show");
    return;
  }

  document.getElementById("finalWinner").innerHTML = "الفائز: " + escapeHTML(fr.winner || "-");
  const losers = Array.isArray(fr.losers) ? fr.losers : [];
  document.getElementById("finalLosers").innerHTML = losers.length
    ? `<div class="finalLoser">الخاسر: ${escapeHTML(losers.join("، "))}</div>`
    : "";
  document.getElementById("finalRows").innerHTML = (fr.players || []).map(p =>
    `<tr><td>${escapeHTML(p.name || "-")}</td><td>${p.score || 0}</td><td>${p.wins || 0}</td></tr>`
  ).join("");
  overlay.classList.add("show");
}

function renderLog(){
  const logEl = document.getElementById("log");
  if(!logEl || !state) return;

  logEl.innerHTML = (state.log || []).map(msg => {
    if(typeof msg === "object" && msg.type === "chat"){
      const color = getPlayerColor(msg.id);
      const avatar = (msg.avatar && msg.avatar !== "auto") ? msg.avatar : "💬";
      return `
        <div class="chatLine">
          <span class="chatAvatar">${avatar}</span>
          <span class="chatName" style="color:${color}">${escapeHTML(msg.name || "لاعب")}:</span>
          <span class="chatText">${escapeHTML(msg.text || "")}</span>
        </div>
      `;
    }

    const text = String(msg || "");
    if(text.includes("دخل") || text.includes("خرج") || text.includes("انضم") || text.includes("غادر") || text.includes("طرد") || text.includes("مشاهد")){
      return `<div class="logLine">${escapeHTML(text)}</div>`;
    }
    return "";
  }).join("");

  logEl.scrollTop = logEl.scrollHeight;
}

function renderSpectators(){
  const box = document.getElementById("spectatorsBox");
  if(!box || !state) return;

  const spectators = state.spectators || [];
  box.classList.toggle("hidden", spectators.length === 0);

  box.innerHTML = `
    <div class="spectatorsTitle">👀 المشاهدين</div>
    ${spectators.map(s => {
      const avatar = (s.avatar && s.avatar !== "auto") ? s.avatar : "👀";
      const kickBtn = (state.host === myId || state.hostId === myId)
        ? `<button class="redBtn" onclick="kickPlayer('${s.id}')">طرد</button>`
        : "";
      return `
        <span class="spectatorChip">
          <span>${avatar}</span>
          <span>${escapeHTML(s.name || "مشاهد")}</span>
          ${kickBtn}
        </span>
      `;
    }).join("")}
  `;
}

function renderSeats(){
  if(!state) return;

  const players = state.players || [];
  const me = players.find(p => p.id === myId);
  const takenSeats = players.map(p => Number(p.seat));

  for(let i=0; i<6; i++){
    const seat = document.getElementById("seat" + i);
    if(!seat) continue;

    seat.classList.remove("active", "empty");

    if(i === 0){
      const hand = document.getElementById("hand");
      seat.querySelectorAll(".avatarBadge,.playerName,.playerMeta,.playerScore,.spectatorNote,.sitChoices").forEach(x => x.remove());

      if(isSpectator()){
        let buttons = "";

        for(let s=0; s<6; s++){
          if(!takenSeats.includes(s)){
            buttons += `<button class="green" onclick="sitAtSeat(${s})">المقعد ${s + 1}</button>`;
          }
        }

        seat.insertAdjacentHTML("afterbegin", `
          <div class="sitChoices">
            <div class="spectatorNote">👀 أنت مشاهد — اختر مقعد للعب</div>
            ${buttons || `<div class="spectatorNote">كل المقاعد محجوزة</div>`}
          </div>
        `);

        if(hand) hand.innerHTML = "";
        continue;
      }

      if(me){
        seat.insertAdjacentHTML("afterbegin", `
          ${avatarHtml(me)}
          <div class="playerName">
            ${me.id === state.hostId ? "👑 " : ""}${escapeHTML(me.name)}
          </div>
          <div class="playerMeta">
            <span class="playerCards">${(state.myHand || []).length}</span> كرت
            ${scoreHtml(me)}
          </div>
        `);

        if(players[state.turn] && players[state.turn].id === me.id){
          seat.classList.add("active");
        }

        if(hand && hand.parentElement !== seat){
          seat.appendChild(hand);
        }
      }

      continue;
    }

    const p = players.find(pp => Number(pp.seat) === i);

    if(!p){
      seat.classList.add("empty");
      seat.innerHTML = "";
      continue;
    }

    if(p.id === myId){
      seat.innerHTML = "";
      continue;
    }

    const teamTxt = p.team ? ` — ${escapeHTML(p.team)}` : "";

    const kickBtn = (state.host === myId || state.hostId === myId) && p.id !== myId
      ? `<button class="redBtn" onclick="kickPlayer('${p.id}')">طرد</button>`
      : "";

    seat.innerHTML = `
      ${avatarHtml(p)}
      <div class="playerName">
        ${p.id === state.hostId ? "👑 " : ""}${escapeHTML(p.name)}
      </div>
      <div class="playerMeta">
        <span class="playerCards">${p.count ?? p.cards ?? 0}</span> كرت${teamTxt}
        ${scoreHtml(p)}
      </div>
      ${kickBtn}
    `;

    if(players[state.turn] && players[state.turn].id === p.id){
      seat.classList.add("active");
    }
  }
}

function render(){
  if(!state) return;

  const players = state.players || [];
  const currentPlayer = players[state.turn];

  document.getElementById("turn").innerHTML = "🔥 الدور: " + escapeHTML(currentPlayer ? currentPlayer.name : "-");

  const colorMap = {red:"#ff4b4b", yellow:"#ffd84d", greenc:"#35d66b", bluec:"#4da3ff", black:"#ffffff"};
  const colorNameMap = {red:"أحمر", yellow:"أصفر", greenc:"أخضر", bluec:"أزرق", black:"اختيار"};

  document.getElementById("need").innerHTML =
    "اللون: <span style='color:" + (colorMap[state.color] || "#fff") + "'>" +
    escapeHTML(colorNameMap[state.color] || state.color || "-") +
    "</span>";

  let penalty = "";
  if(Number(state.pendingDraw4 || 0) > 0) penalty = "عقوبة +4: " + state.pendingDraw4 + " — رد بنفس اللون أو اسحب";
  else if(Number(state.pendingDraw2 || 0) > 0) penalty = "عقوبة +2: " + state.pendingDraw2 + " — رد بنفس اللون أو اسحب";

  document.getElementById("penaltyLine").innerHTML = penalty;
  document.getElementById("top").innerHTML = state.top ? tableCardHtml(state.top) : "";

  document.getElementById("hand").innerHTML = isSpectator()
    ? '<div class="spectatorNote">👀 أنت مشاهد — دردشة فقط</div>'
    : sortedHandWithIndex(state.myHand || []).map(c => cardHtml(c)).join("");

  const percent = state.timeLimit
    ? Math.max(0, Math.min(100, (Number(state.timeLeft || 0) / Number(state.timeLimit || 1)) * 100))
    : 0;

  const timerBar = document.getElementById("timerBar");
  if(timerBar) timerBar.style.width = percent + "%";

  document.getElementById("timeText").innerHTML = state.started
    ? "⏱️ الوقت المتبقي: " + (state.timeLeft ?? 0) + " ثانية"
    : "⏱️ وقت اللاعب: " + (state.timeLimit ?? "-") + " ثانية";

  renderLog();
  renderSeats();
  renderSpectators();
  renderHostPanel();
  renderFinalResults();
}

socket.on("joined", data => {
  myId = data.playerId;
  roomCode = data.room;
  document.getElementById("joinBox")?.classList.add("hidden");
  document.getElementById("controls")?.classList.remove("hidden");
  document.getElementById("arena")?.classList.remove("hidden");
  document.getElementById("logBox")?.classList.remove("hidden");
});

socket.on("state", data => {
  console.log("✅ state received", data);
  state = data;
  myId = data.myId;
  myRole = data.role || "spectator";
  roomCode = data.room;

  document.getElementById("joinBox")?.classList.add("hidden");
  document.getElementById("controls")?.classList.remove("hidden");
  document.getElementById("arena")?.classList.remove("hidden");
  document.getElementById("logBox")?.classList.remove("hidden");

  render();
});

socket.on("error_msg", msg => alert(typeof msg === "string" ? msg : (msg?.message || JSON.stringify(msg))));
socket.on("kicked", () => { alert("تم طردك من الغرفة"); location.reload(); });
socket.on("left_room", () => location.reload());
socket.on("connect", () => console.log("✅ socket connected", socket.id));
socket.on("connect_error", err => console.log("❌ socket error", err.message));

document.getElementById("chatInput")?.addEventListener("keydown", function(e){
  if(e.key === "Enter") sendChat();
});

document.getElementById("colorPicker")?.addEventListener("click", function(e){
  if(e.target === this){
    this.classList.remove("show");
    selectedIndex = null;
  }
});
</script>
</main>
</body>
</html>
