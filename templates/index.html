<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO أبيها - النهائي</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Tahoma,sans-serif;color:white;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(70,140,255,.28),transparent 35%),linear-gradient(180deg,#0c234a,#050b18 75%)}
main{max-width:1320px;margin:auto;padding:clamp(8px,2vw,16px)}
h1{margin:8px 0 10px;text-shadow:0 4px 10px #000;font-size:clamp(22px,5vw,36px)}
.join,.controls,.logBox{background:linear-gradient(135deg,rgba(22,53,105,.95),rgba(7,17,38,.95));border:1px solid rgba(120,190,255,.25);border-radius:24px;padding:12px;margin-bottom:14px;box-shadow:0 18px 55px #0008}
input,select{border:0;border-radius:14px;padding:12px 14px;margin:6px;font-size:16px;min-width:160px}
button{border:0;border-radius:15px;padding:12px 18px;margin:6px;font-weight:900;cursor:pointer;color:#071126;background:linear-gradient(180deg,#fff0a6,#ffd166);box-shadow:0 7px 0 #9b6a00,0 12px 22px #0008}
button:active{transform:translateY(4px);box-shadow:0 3px 0 #9b6a00}
.green{background:linear-gradient(180deg,#7affb2,#35dd7b);box-shadow:0 7px 0 #0b7d3b,0 12px 22px #0008}
.blueBtn{background:linear-gradient(180deg,#79c6ff,#2f80ff);color:white;box-shadow:0 7px 0 #06449d,0 12px 22px #0008}
.redBtn{background:linear-gradient(180deg,#ff8aa0,#ff4d6d);color:white;box-shadow:0 7px 0 #a50d28,0 12px 22px #0008}
.hidden{display:none}

/* ===== الطاولة الرئيسية ===== */
.arena{position:relative;min-height:760px;border-radius:clamp(20px,4vw,34px);overflow:hidden;padding:clamp(10px,2vw,22px);padding-bottom:230px;background:radial-gradient(circle at 50% 42%,rgba(68,140,255,.20),transparent 43%),linear-gradient(135deg,rgba(20,55,105,.8),rgba(5,10,24,.97));border:1px solid rgba(120,190,255,.26);box-shadow:inset 0 0 120px #0009,0 26px 85px #000b}
.table{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(88vw,980px);height:clamp(420px,58vh,560px);border-radius:50%;background:radial-gradient(circle,#2f86ff,#123e91 58%,#09245b);border:clamp(5px,1.3vw,10px) solid rgba(255,255,255,.12);box-shadow:inset 0 0 70px rgba(76,201,240,.28),inset 0 -45px 90px rgba(0,0,0,.30),0 0 0 6px rgba(76,201,240,.20),0 35px 85px #000c}
.tableInfo{position:relative;z-index:2;height:100%;display:grid;place-items:center}
.info{position:relative;min-width:0;padding:0;background:transparent;border:0;box-shadow:none}

/* ===== الكرت الأساسي + زر السحب + معلومات الدور ===== */
.centerPlayArea{position:relative;display:flex;align-items:center;justify-content:center;gap:0;width:280px;height:260px;margin:auto}
#top{display:flex;justify-content:center;align-items:center;position:relative;z-index:25}
#top .card{width:125px;height:185px;font-size:54px;transform:rotate(-7deg);z-index:25}
#top .card .mark{font-size:58px}
.drawOutsideBtn{position:absolute;right:-95px;top:50%;transform:translateY(-50%) rotate(-8deg);width:105px;height:72px;font-size:20px;z-index:35;display:flex;align-items:center;justify-content:center;border:3px solid #fff3b0;box-shadow:0 0 22px rgba(255,209,102,.9),0 8px 0 #9b6a00,0 14px 24px #0008}
.ovalInfo{
  position:absolute !important;
  left:-140px !important;   /* مربع الدور يسار الكرت */
  top:50% !important;
  transform:translateY(-50%) !important;

  width:170px !important;
  min-height:75px !important;

  border-radius:18px !important;
  background:rgba(0,0,0,.45) !important;
  border:2px solid rgba(255,255,255,.7) !important;

  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  font-weight:900;

  z-index:30 !important;
}
#timeText{font-size:13px;opacity:.92;margin-bottom:12px;position:relative;z-index:40}
#penaltyLine{font-size:14px;min-height:18px;margin:0 0 6px;color:#fff;text-shadow:0 3px 8px #000;position:relative;z-index:40}

/* ===== شكل الكروت ===== */
.card{display:inline-flex;align-items:center;justify-content:center;position:relative;width:76px;height:112px;border-radius:19px;margin:4px;font-size:28px;font-weight:900;cursor:pointer;border:4px solid #fff8e8;box-shadow:0 10px 18px #0009;overflow:hidden;transition:.14s;isolation:isolate}
.card:hover{transform:translateY(-7px) rotate(-2deg);filter:brightness(1.08)}
.red{background:linear-gradient(145deg,#ff4b66,#aa071b)}
.bluec{background:linear-gradient(145deg,#45b6ff,#064dbb)}
.greenc{background:linear-gradient(145deg,#46ee91,#04783a)}
.yellow{background:linear-gradient(145deg,#ffe56a,#d69000);color:#1b1600}
.black{background:linear-gradient(145deg,#333,#050505)}
.card::before{content:"";position:absolute;right:7%;top:6%;width:30%;aspect-ratio:1;border-radius:50%;background:url("https://dirtyface.pythonanywhere.com/media/e59c7ec4856a4d67a0dea3147d58edc0.jpeg") center/cover no-repeat;opacity:.92;box-shadow:0 2px 8px #0009;border:1px solid rgba(255,255,255,.35);z-index:1}
.card::after{content:"أبيها";position:absolute;left:8%;bottom:6%;font-size:13px;letter-spacing:.3px;opacity:.95;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.33);border:1px solid rgba(255,255,255,.22);z-index:2}
.card .mark{position:absolute;top:53%;left:50%;transform:translate(-50%,-50%);font-size:34px;text-shadow:0 3px 8px #000;z-index:3}
.card .skullBig{position:absolute;top:20%;left:50%;transform:translateX(-50%);font-size:58px;opacity:.18;z-index:0;filter:drop-shadow(0 4px 8px #000)}

/* ===== أماكن اللاعبين حول الطاولة ===== */
.seat{position:absolute;width:118px;min-height:70px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:7px;border-radius:18px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18);box-shadow:none;overflow:hidden;z-index:10}
.seat.active{outline:4px solid #ffd166;box-shadow:0 0 35px rgba(255,209,102,.9)}
.s1{right:5%;top:48%;bottom:auto}.s2{right:8%;top:12%}.s3{left:50%;top:4%;transform:translateX(-50%)}.s4{left:8%;top:12%}.s5{left:5%;top:48%;bottom:auto}
.playerName{font-weight:900;font-size:clamp(12px,2.2vw,17px);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 5px #000}
.playerMeta{font-size:clamp(10px,1.8vw,13px);opacity:.9;line-height:1.35}.playerCards{font-weight:900;color:#ffd166}.seat.empty{opacity:.22}

/* ===== كروت اللاعب مثل المروحة ===== */
.seat.s0.me{left:50%;bottom:-60px;transform:translateX(-50%);width:min(96%,920px);min-height:220px;background:transparent;border:0;box-shadow:none;z-index:30;overflow:visible}
.seat.s0.me .playerName,.seat.s0.me .playerMeta{position:relative;top:10px;z-index:40}
.hand{width:100%;min-height:185px;white-space:nowrap;overflow:visible;border-radius:20px;padding:0;background:transparent;border:0;display:flex;gap:0;align-items:flex-end;justify-content:center}
.hand .card{flex:0 0 auto;width:92px;height:138px;font-size:28px;margin-left:-20px;transform-origin:bottom center}
.hand .card .mark{font-size:34px}
.hand{
  transform:translateY(-30px); /* 👈 يرفع الكروت */
  min-height:180px;
}

.hand .card:nth-child(1){transform:rotate(22deg) translateY(18px)}
.hand .card:nth-child(2){transform:rotate(16deg) translateY(10px)}
.hand .card:nth-child(3){transform:rotate(10deg) translateY(4px)}
.hand .card:nth-child(4){transform:rotate(4deg)}
.hand .card:nth-child(5){transform:rotate(-3deg)}
.hand .card:nth-child(6){transform:rotate(-9deg) translateY(4px)}
.hand .card:nth-child(7){transform:rotate(-15deg) translateY(10px)}
.hand .card:nth-child(8){transform:rotate(-21deg) translateY(18px)}
.hand .card:nth-child(9){transform:rotate(-25deg) translateY(24px)}
.hand .card:nth-child(10){transform:rotate(-28deg) translateY(30px)}
.hand .card:hover{transform:translateY(-32px) scale(1.12)!important;z-index:99}

.log{height:128px;overflow:auto;background:rgba(0,0,0,.38);border-radius:16px;padding:10px;line-height:1.7;text-align:right}
#timerBar{height:10px;background:linear-gradient(to right,red,orange);width:100%}
#colorPicker{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:999}
#colorPicker.show{display:grid}.pickerBox{background:#111;padding:20px;border-radius:20px}.pickerBox button{width:60px;height:60px;margin:10px;border-radius:50%;border:none;cursor:pointer}
.timerSetup{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.24);padding:8px 10px;border-radius:16px;margin:6px}.timerSetup select{min-width:100px;margin:0}.exitRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}.ruleHint{font-size:13px;opacity:.86;line-height:1.7;margin-top:7px}

/* ===== آيباد وموبايل ===== */
@media(max-width:900px){.drawOutsideBtn{right:-78px;width:92px;height:62px;font-size:18px}.table{width:92vw;height:440px}.seat.s0.me{bottom:-105px}}
@media(max-width:760px){input,select{min-width:128px;font-size:14px;padding:10px}button{padding:10px 12px;margin:4px;border-radius:13px}.join,.controls,.logBox{border-radius:18px;padding:8px}.arena{min-height:690px;padding-bottom:200px}.table{top:40%;width:94vw;height:390px}.centerPlayArea{width:220px;height:210px}#top .card{width:95px;height:142px}.drawOutsideBtn{right:-65px;top:50%;width:74px;height:54px;font-size:15px}.ovalInfo{left:-95px !important;top:50% !important;transform:translateY(-50%) !important;width:130px !important;font-size:12px !important}.seat:not(.me){width:88px;min-height:58px;font-size:11px}.s1{right:2%;top:50%}.s2{right:4%;top:13%}.s3{top:1%}.s4{left:4%;top:13%}.s5{left:2%;top:50%}.seat.s0.me{bottom:-98px;width:98%;min-height:160px}.hand{min-height:155px}.hand .card{width:72px;height:108px;margin-left:-15px}.hand .card .mark{font-size:28px}.log{height:90px;font-size:12px}}
@media(max-width:480px){.arena{min-height:650px;padding-bottom:185px}.table{width:96vw;height:360px}.centerPlayArea{width:190px;height:190px}.drawOutsideBtn{right:-54px;width:66px;height:48px;font-size:14px}.ovalInfo{left:-80px !important;top:50% !important;transform:translateY(-50%) !important;width:112px !important;font-size:11px !important}#top .card{width:86px;height:128px}.seat:not(.me){width:76px;min-height:52px}.hand .card{width:66px;height:100px;margin-left:-14px}.seat.s0.me{bottom:-92px}}
</style>
</head>
<body>
<main>
<h1>UNO أبيها - النهائي</h1>

<div class="join" id="joinBox">
  <input id="nameInput" placeholder="اسم اللاعب">
  <input id="roomInput" value="ROOM1">
  <select id="modeInput" onchange="toggleTeamOptions()">
    <option value="solo">فردي</option>
    <option value="teams">جماعي</option>
  </select>
  <select id="teamModeInput" class="teamOnly hidden" onchange="toggleTeamOptions()">
    <option value="auto">تلقائي</option>
    <option value="manual">يدوي</option>
  </select>
  <select id="teamCountInput" class="teamOnly hidden">
    <option value="2">فريقين</option>
    <option value="3">3 فرق</option>
  </select>
  <select id="teamInput" class="manualOnly hidden">
    <option value="A">أزرق</option>
    <option value="B">برتقالي</option>
    <option value="C">بنفسجي</option>
  </select>
  <button class="green" onclick="joinGame()">دخول</button>
</div>

<div class="controls hidden" id="controls">
  <span class="timerSetup">⏱️ وقت اللاعب قبل البداية: <select id="timeLimitInput"><option value="10">10 ثواني</option><option value="15">15 ثانية</option><option value="20">20 ثانية</option><option value="30" selected>30 ثانية</option><option value="45">45 ثانية</option><option value="60">60 ثانية</option><option value="90">90 ثانية</option><option value="120">120 ثانية</option></select></span>
  <button class="blueBtn" onclick="startGame()">ابدأ</button>
  <button onclick="lastCard()">كرت أخير</button>
  <button class="redBtn" onclick="endGame()">إنهاء اللعبة</button>
  <button onclick="leaveGame()">رجوع / خروج من الغرفة</button>
</div>

<section class="arena hidden" id="arena">
  <div id="timerBar"></div>

  <div class="table">
    <div class="tableInfo">
      <div class="info">
        <h3 id="penaltyLine"></h3>
        <div id="timeText"></div>

        <div class="centerPlayArea">
          <!-- الكرت بالنص -->
          <div id="top"></div>

          <!-- زر السحب يمين الكرت -->
          <button class="drawOutsideBtn" onclick="drawCard()">اسحب</button>

          <!-- الدور + اللون تحت الكرت -->
          <div class="ovalInfo">
            <div id="turn">-</div>
            <div id="need">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="seat s0 me" id="seat0">
    <div id="hand" class="hand"></div>
  </div>
  <div class="seat s1" id="seat1"></div>
  <div class="seat s2" id="seat2"></div>
  <div class="seat s3" id="seat3"></div>
  <div class="seat s4" id="seat4"></div>
  <div class="seat s5" id="seat5"></div>
</section>

<section class="logBox hidden" id="logBox">
  <div id="log" class="log"></div>
  <div style="display:flex;gap:6px;margin-top:8px">
  <input id="chatInput" placeholder="اكتب رسالة..." style="flex:1;min-width:0">
  <button onclick="sendChat()">إرسال</button>
</div>
</section>

<div id="colorPicker">
  <div class="pickerBox">
    <button style="background:red" onclick="chooseColor('red')"></button>
    <button style="background:blue" onclick="chooseColor('bluec')"></button>
    <button style="background:green" onclick="chooseColor('greenc')"></button>
    <button style="background:gold" onclick="chooseColor('yellow')"></button>
  </div>
</div>

<script>
const socket = io();
let roomCode = "";
let myId = null;
let state = null;
let selectedIndex = null;

  function sendChat(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  socket.emit("chat",{room:roomCode,playerId:myId,text});
  input.value = "";
}
function toggleTeamOptions(){
  const mode=document.getElementById("modeInput").value;
  const teamMode=document.getElementById("teamModeInput").value;
  document.querySelectorAll(".teamOnly").forEach(x=>x.classList.toggle("hidden",mode!=="teams"));
  document.querySelectorAll(".manualOnly").forEach(x=>x.classList.toggle("hidden",!(mode==="teams"&&teamMode==="manual")));
}
function kickPlayer(targetId){
  if(!confirm("تأكيد طرد اللاعب؟")) return;
  socket.emit("kick_player",{room:roomCode,hostId:myId,targetId});
}

socket.on("kicked",()=>{
  alert("تم طردك من الغرفة");
  location.reload();
});
function joinGame(){
  const name=document.getElementById("nameInput").value||"لاعب";
  roomCode=(document.getElementById("roomInput").value||"ROOM1").toUpperCase();
  const mode=document.getElementById("modeInput").value;
  const teamMode=document.getElementById("teamModeInput").value;
  const teamCount=document.getElementById("teamCountInput").value;
  const team=document.getElementById("teamInput").value;
  socket.emit("join",{name,room:roomCode,mode,teamMode,teamCount,team});
}

socket.on("joined",data=>{
  myId=data.playerId;
  roomCode=data.room;
  document.getElementById("joinBox").classList.add("hidden");
  document.getElementById("controls").classList.remove("hidden");
  document.getElementById("arena").classList.remove("hidden");
  document.getElementById("logBox").classList.remove("hidden");
});

socket.on("error_msg",msg=>alert(msg));

function startGame(){
  const timeLimit = parseInt(document.getElementById("timeLimitInput")?.value || "30", 10);
  socket.emit("start",{room:roomCode,playerId:myId,timeLimit});
}
function drawCard(){socket.emit("draw",{room:roomCode,playerId:myId});}
function lastCard(){socket.emit("last_card",{room:roomCode,playerId:myId});}
function endGame(){socket.emit("end_game",{room:roomCode,playerId:myId});}
function leaveGame(){socket.emit("leave_room",{room:roomCode,playerId:myId});}
socket.on("left_room",()=>{location.reload();});

function playCard(i){
  const card = state.myHand[i];
  if(card.c === "black"){
    selectedIndex = i;
    document.getElementById("colorPicker").classList.add("show");
  } else {
    socket.emit("play",{room:roomCode,playerId:myId,index:i});
  }
}

function chooseColor(color){
  socket.emit("play",{room:roomCode,playerId:myId,index:selectedIndex,color});
  document.getElementById("colorPicker").classList.remove("show");
}

socket.on("state",data=>{
  state=data;
  render();
});

function cardSymbol(n){
  if(n === "عكس") return "↔";
  if(n === "تخطي") return "⊘";
  return n;
}

function cardHtml(c,i){
  return `<div class="card ${c.c}" onclick="playCard(${i})">
    <span class="skullBig">☠</span>
    <span class="mark">${cardSymbol(c.n)}</span>
  </div>`;
}

function tableCardHtml(c){
  return `<div class="card ${c.c}">
    <span class="skullBig">☠</span>
    <span class="mark">${cardSymbol(c.n)}</span>
  </div>`;
}
function render(){
  if(!state) return;
  document.getElementById("turn").innerHTML="🔥 الدور: "+state.players[state.turn].name;
  const colorMap = {
  red: "#ff4b4b",
  yellow: "#ffd84d",
  greenc: "#35d66b",
  bluec: "#4da3ff",
  black: "#ffffff"
};

document.getElementById("need").innerHTML =
  "اللون: <span style='color:" + (colorMap[state.color] || "#fff") + "'>" + state.color + "</span>";
  let penalty = "";
  if(state.pendingDraw4>0) penalty = "عقوبة +4: "+state.pendingDraw4+" — رد بنفس اللون أو اسحب";
  else if(state.pendingDraw2>0) penalty = "عكس/تخطي: رد بنفس اللون أو اسحب كرتين";
  document.getElementById("penaltyLine").innerHTML = penalty;
  document.getElementById("top").innerHTML = state.top ? tableCardHtml(state.top) : "";
  document.getElementById("hand").innerHTML = (state.myHand||[]).map((c,i)=>cardHtml(c,i)).join("");
  document.getElementById("log").innerHTML = (state.log||[]).join("<br>");
  const percent = state.timeLimit ? Math.max(0, Math.min(100, (state.timeLeft/state.timeLimit)*100)) : 0;
  document.getElementById("timerBar").style.width = percent+"%";
  document.getElementById("timeText").innerHTML = state.started ? ("⏱️ الوقت المتبقي: " + state.timeLeft + " ثانية") : ("⏱️ وقت اللاعب: " + state.timeLimit + " ثانية");
  renderSeats();
}

function renderSeats(){
  if(!state || !state.players) return;
  const players = state.players;
  const meIndex = players.findIndex(p => p.id === myId);
  for(let i=0;i<6;i++){
    const seat = document.getElementById("seat"+i);
    if(!seat) continue;
    seat.classList.toggle("active", false);
    if(i===0){
      const me = players[meIndex] || players[0];
      seat.classList.toggle("empty", !me);
      if(me){
        const hand = document.getElementById("hand");
        seat.querySelectorAll(".playerName,.playerMeta").forEach(x=>x.remove());
        seat.insertAdjacentHTML("afterbegin", `<div class="playerName">👤 ${me.name}</div><div class="playerMeta"><span class="playerCards">${(state.myHand||[]).length}</span> كرت</div>`);
        if(players[state.turn] && players[state.turn].id === me.id) seat.classList.add("active");
        if(hand && hand.parentElement !== seat) seat.appendChild(hand);
      }
      continue;
    }
    const idx = meIndex >= 0 ? (meIndex + i) % players.length : i;
    const p = players[idx];
    if(!p || idx === meIndex || i >= players.length){
      seat.classList.add("empty");
      seat.innerHTML = "";
      continue;
    }
    seat.classList.remove("empty");
    const teamTxt = p.team ? ` — ${p.team}` : "";
   const kickBtn = state.host === myId && p.id !== myId
  ? `<button class="redBtn" onclick="kickPlayer('${p.id}')">طرد</button>`
  : "";

seat.innerHTML = `<div class="playerName">👤 ${p.name}</div><div class="playerMeta"><span class="playerCards">${p.count ?? p.cards ?? 0}</span> كرت${teamTxt}</div>${kickBtn}`;
    if(players[state.turn] && players[state.turn].id === p.id) seat.classList.add("active");
  }
}
</script>
</main>
</body>
</html>
