
<!DOCTYPE html>
<html>
<head>
<title>ABIEHA LEGENDARY</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
body{background:black;color:white;text-align:center;font-family:Arial}
button{padding:15px;margin:10px;font-size:20px}
#intro{position:fixed;top:0;left:0;width:100%;height:100%;background:black;display:flex;flex-direction:column;justify-content:center}
</style>
</head>
<body>

<div id="intro">
<h1>🔥 أبيها 🔥</h1>
<button onclick="enter()">ابدأ</button>
</div>

<input id="name" placeholder="اسمك">
<input id="room" value="ROOM1">
<button onclick="join()">دخول</button>

<br>
<button onclick="start()">ابدأ اللعب</button>

<script>
const s = io();
let id;

function enter(){
 document.getElementById("intro").style.display="none";
}

function join(){
 s.emit("join",{name:document.getElementById("name").value,room:document.getElementById("room").value});
}

s.on("joined",d=>{id=d.id});

function start(){
 s.emit("start",{room:document.getElementById("room").value});
}
</script>

</body>
</html>
