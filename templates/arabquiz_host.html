<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرب كويز - الهوست</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#231942,#111);color:#fff;text-align:center}.wrap{max-width:1200px;margin:0 auto;padding:18px}.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px;box-shadow:0 12px 35px #0008}.title{font-size:42px;font-weight:900;margin:10px}.pin{font-size:88px;font-weight:900;color:#ffd23f;letter-spacing:8px;text-shadow:0 5px 0 #000}.small{opacity:.85;font-size:20px}.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}input,button{font-size:22px;padding:14px 18px;border-radius:16px;border:0;margin:6px}input{width:130px;text-align:center}button{background:#ffd23f;color:#111;font-weight:900;cursor:pointer}button.secondary{background:#fff}.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:12px 0}.stat{background:#0007;border-radius:18px;padding:14px;font-size:26px;font-weight:800}.timer{font-size:68px;color:#00ff9d}.q{font-size:42px;font-weight:900;margin:18px;line-height:1.4}.qimg{max-width:92%;max-height:360px;border-radius:24px;display:none;box-shadow:0 10px 25px #0008}.answer{font-size:36px;color:#ffd23f;font-weight:900;margin:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.player{background:#ffffff14;border-radius:16px;padding:14px;font-size:22px;font-weight:800}.answered{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.good{background:#00bb77;color:#fff;border-radius:16px;padding:13px 18px;font-size:22px;font-weight:900}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{grid-template-columns:1fr}.pin{font-size:56px}.q{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="setup">
    <div class="title">🎮 عرب كويز</div>
    <div class="small">شاشة الهوست مثل كاهوت</div>
    <div class="row">
      <label>الجولات <input id="roundLimit" type="number" value="10" min="1" max="50"></label>
      <label>الوقت <input id="timeLimit" type="number" value="25" min="5" max="120"></label>
    </div>
    <button onclick="createRoom()">إنشاء لعبة</button>
  </div>

  <div class="card hidden" id="game">
    <div class="small">كود دخول اللاعبين</div>
    <div class="pin" id="pinText">------</div>
    <div class="small">افتح للاعبين: <b>/arabquiz-play</b></div>

    <div class="row">
      <button onclick="startGame()">Start</button>
      <button onclick="nextQuestion()" class="secondary">Next</button>
      <button onclick="resetGame()" class="secondary">Reset</button>
    </div>

    <div class="top">
      <div class="stat">الحالة<br><span id="statusText">lobby</span></div>
      <div class="stat">الجولة<br><span id="roundText">0/0</span></div>
      <div class="stat">الوقت<br><span class="timer" id="timerText">0</span></div>
    </div>

    <img id="qImg" class="qimg">
    <div class="q" id="questionText">انتظر دخول اللاعبين</div>
    <div class="answer" id="answerText"></div>

    <div class="grid">
      <div class="card">
        <h2>✅ اللي جاوبوا</h2>
        <div class="answered" id="answeredBox"></div>
      </div>
      <div class="card">
        <h2>🏆 الترتيب</h2>
        <div class="players" id="playersBox"></div>
      </div>
    </div>
  </div>
</div>
<script>
const socket=io();let pin="";
function createRoom(){socket.emit("arabquiz_host_create",{roundLimit:roundLimit.value,timeLimit:timeLimit.value});}
socket.on("arabquiz_host_created",d=>{pin=d.pin;setup.classList.add("hidden");game.classList.remove("hidden");pinText.innerText=pin;});
socket.on("arabquiz_host_state",s=>{pin=s.pin;pinText.innerText=s.pin;statusText.innerText=s.status;roundText.innerText=s.round+"/"+s.roundLimit;timerText.innerText=s.timeLeft||0;if(s.question){questionText.innerText=s.question.question;if(s.question.image){qImg.src=s.question.image;qImg.style.display="inline-block";}else qImg.style.display="none";}else{questionText.innerText="انتظر دخول اللاعبين";qImg.style.display="none";}answerText.innerText=s.correctAnswer?"الجواب: "+s.correctAnswer:"";renderPlayers(s.players||[]);renderAnswered(s.answered||[]);});
function startGame(){socket.emit("arabquiz_host_start",{pin,roundLimit:roundLimit.value,timeLimit:timeLimit.value});}
function nextQuestion(){socket.emit("arabquiz_host_next",{pin});}
function resetGame(){socket.emit("arabquiz_host_reset",{pin});}
function renderPlayers(players){players.sort((a,b)=>b.score-a.score);playersBox.innerHTML="";players.forEach((p,i)=>{let div=document.createElement("div");div.className="player";div.innerHTML=`${i+1}. ${p.name}<br>${p.score} نقطة`;playersBox.appendChild(div);});}
function renderAnswered(arr){answeredBox.innerHTML="";arr.forEach(a=>{let div=document.createElement("div");div.className="good";div.innerText=`${a.place}) ${a.name} +${a.points}`;answeredBox.appendChild(div);});}
</script>
</body>
</html>
