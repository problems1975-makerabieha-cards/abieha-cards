```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تتحداني - لاعب</title>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(180deg,#201044,#070711);
  color:white;
  font-family:Arial,Tahoma,sans-serif;
  text-align:center;
  min-height:100vh;
}

.box{
  width:min(94%,680px);
  margin:18px auto;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:28px;
  padding:22px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

h1{
  font-size:42px;
  margin:10px;
}

.sub{
  opacity:.85;
  font-size:18px;
}

input,
button{
  font-size:24px;
  padding:15px;
  margin:8px;
  border-radius:16px;
  border:0;
}

input{
  width:min(90%,360px);
}

button{
  background:#ffd43b;
  color:#111;
  font-weight:900;
  cursor:pointer;
}

.timer{
  font-size:60px;
  color:#00ff9d;
  font-weight:900;
}

.answerBox{
  min-height:70px;
  background:white;
  color:#111;
  border-radius:20px;
  padding:16px;
  margin:18px 0;
  font-size:34px;
  font-weight:900;
  word-break:break-word;
}

.tiles{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.tile{
  background:#2f80ed;
  color:white;
  min-width:64px;
  font-size:32px;
  padding:17px 20px;
  border-radius:18px;
}

.tile.used{
  opacity:.25;
  pointer-events:none;
}

.msg{
  font-size:28px;
  color:#00ff9d;
  margin:14px;
}

.wrong{
  color:#ff4b4b;
  font-size:23px;
  min-height:30px;
}

.answer{
  font-size:28px;
  color:#ffd43b;
  font-weight:900;
}

.leader{
  margin-top:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  background:rgba(255,255,255,.1);
  padding:12px 14px;
  border-radius:14px;
  margin:8px 0;
  font-size:20px;
}

.podium{
  display:none;
}

.medal{
  font-size:48px;
}

.pod{
  background:rgba(255,255,255,.12);
  border-radius:18px;
  padding:14px;
  margin:10px 0;
}

#playerQuestionText{
  font-size:28px;
  font-weight:bold;
  margin:15px;
}

#answerHint{
  font-size:22px;
  color:#ffd43b;
  font-weight:bold;
  margin:10px;
}

@media(max-width:520px){
  h1{
    font-size:34px;
  }

  .tile{
    font-size:27px;
    min-width:58px;
  }

  .answerBox{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div id="joinBox" class="box">

  <h1>تتحداني ⚡</h1>

  <div class="sub">
    اكتب كود الهوست وادخل اسمك
  </div>

  <input
    id="pinInput"
    placeholder="كود اللعبة"
    inputmode="numeric"
  >

  <br>

  <input
    id="nameInput"
    placeholder="اسمك"
  >

  <br>

  <button onclick="joinGame()">
    دخول
  </button>

  <div id="joinError" class="wrong"></div>

</div>


<div id="gameBox" class="box" style="display:none">

  <h2>
    PIN:
    <span id="pinText"></span>
  </h2>

  <div id="roundText" class="sub"></div>

  <div id="timeText" class="timer"></div>

  <div id="messageText" class="msg">
    انتظر السؤال
  </div>

  <div id="playerQuestionText"></div>

  <div id="answerHint"></div>

  <div id="answerBox" class="answerBox"></div>

  <div class="tiles" id="tilesBox"></div>

  <div>
    <button onclick="backspace()">مسح</button>
    <button onclick="clearAnswer()">مسح الكل</button>
    <button onclick="submitAnswer()">إرسال</button>
  </div>

  <div id="correctAnswer" class="answer"></div>

  <div id="podiumBox" class="podium"></div>

  <div class="leader">

    <h2>الترتيب</h2>

    <div id="playersBox"></div>

  </div>

</div>


<script>

const socket = io();

let pin = "";
let selected = [];
let lastQuestionKey = null;
let answeredCurrent = false;


function joinGame(){

  pin = document
    .getElementById("pinInput")
    .value
    .trim();

  const name =
    document
      .getElementById("nameInput")
      .value
      .trim() || "Player";

  socket.emit("arabquiz_player_join", {
    pin,
    name
  });

}


socket.on("arabquiz_join_error", data => {

  document
    .getElementById("joinError")
    .innerText = data.msg;

});


socket.on("arabquiz_player_joined", data => {

  pin = data.pin;

  document
    .getElementById("joinBox")
    .style.display = "none";

  document
    .getElementById("gameBox")
    .style.display = "block";

  document
    .getElementById("pinText")
    .innerText = pin;

});


socket.on("arabquiz_wrong", () => {

  document
    .getElementById("messageText")
    .innerText = "غلط، جرّب مرة ثانية";

});


socket.on("arabquiz_kicked", () => {

  alert("تم طردك من الغرفة");

  location.href = "/tatahadani-play";

});


socket.on("arabquiz_player_state", state => {

  document
    .getElementById("pinText")
    .innerText = state.pin;

  document
    .getElementById("roundText")
    .innerText =
      "الجولة: " +
      state.round +
      "/" +
      state.roundLimit;

  document
    .getElementById("timeText")
    .innerText = state.timeLeft || "";

  answeredCurrent = !!state.answered;

  document
    .getElementById("answerHint")
    .innerText = state.hint || "";


  /*
   عرض نص السؤال فقط.
   لا يتم عرض أو تحميل أي صورة.
  */

  if(state.question){

    document
      .getElementById("playerQuestionText")
      .innerText =
        state.question.question || "";

  }else{

    document
      .getElementById("playerQuestionText")
      .innerText = "";

  }


  if(state.status === "lobby"){

    setMsg("انتظر الهوست يبدأ");

  }else if(state.status === "question"){

    setMsg(
      state.answered
        ? "تم إرسال إجابتك ✅"
        : "رتب الجواب"
    );

  }else if(state.status === "result"){

    setMsg("انتهت الجولة");

  }else if(state.status === "finished"){

    setMsg("انتهت اللعبة 🏆");

  }


  document
    .getElementById("correctAnswer")
    .innerText =
      state.correctAnswer
        ? "الجواب الصحيح: " + state.correctAnswer
        : "";


  /*
   لا نصفر الجواب مع تحديث التايمر.
   يتم تصفيره فقط عند وصول سؤال جديد.
  */

  if(lastQuestionKey !== state.questionKey){

    lastQuestionKey = state.questionKey;

    selected = [];

    updateAnswerBox();

    renderTiles(state.tiles || []);

  }else if(
    state.status !== "question" ||
    state.answered
  ){

    renderTiles([]);

  }


  if(state.status === "finished"){

    renderPodium(state.podium || []);

  }else{

    document
      .getElementById("podiumBox")
      .style.display = "none";

  }


  renderPlayers(state.players || []);

});


function setMsg(text){

  document
    .getElementById("messageText")
    .innerText = text;

}


function renderTiles(tiles){

  const box =
    document.getElementById("tilesBox");

  box.innerHTML = "";

  tiles.forEach(tile => {

    const button =
      document.createElement("button");

    button.className = "tile";

    button.innerText = tile.text;

    button.dataset.id = tile.id;

    button.onclick = () => {

      if(answeredCurrent){
        return;
      }

      button.classList.add("used");

      selected.push(tile);

      updateAnswerBox();

    };

    box.appendChild(button);

  });

}


function updateAnswerBox(){

  document
    .getElementById("answerBox")
    .innerText =
      selected
        .map(item => item.text)
        .join(" ");

}


function backspace(){

  if(
    selected.length === 0 ||
    answeredCurrent
  ){
    return;
  }

  const last = selected.pop();

  document
    .querySelectorAll(".tile")
    .forEach(button => {

      if(button.dataset.id == last.id){

        button
          .classList
          .remove("used");

      }

    });

  updateAnswerBox();

}


function clearAnswer(){

  if(answeredCurrent){
    return;
  }

  selected = [];

  document
    .querySelectorAll(".tile")
    .forEach(button => {

      button
        .classList
        .remove("used");

    });

  updateAnswerBox();

}


function submitAnswer(){

  if(answeredCurrent){
    return;
  }

  const answer =
    selected
      .map(item => item.text)
      .join(" ");

  socket.emit("arabquiz_player_answer", {
    pin,
    answer
  });

}


function renderPlayers(players){

  const box =
    document.getElementById("playersBox");

  box.innerHTML = "";

  players.forEach((player, index) => {

    const div =
      document.createElement("div");

    div.className = "row";

    const medal =
      index === 0
        ? "🏆 "
        : index === 1
          ? "🥈 "
          : index === 2
            ? "🥉 "
            : "";

    div.innerHTML = `
      <span>
        ${medal}${index + 1}.
        ${escapeHtml(player.name)}
      </span>

      <b>${player.score}</b>
    `;

    box.appendChild(div);

  });

}


function renderPodium(podium){

  const box =
    document.getElementById("podiumBox");

  box.style.display = "block";

  box.innerHTML =
    "<h2>🏆 التتويج</h2>";

  const medals = [
    "🏆",
    "🥈",
    "🥉"
  ];

  podium.forEach((player, index) => {

    const div =
      document.createElement("div");

    div.className = "pod";

    div.innerHTML = `
      <div class="medal">
        ${medals[index] || "🏅"}
      </div>

      <b>${escapeHtml(player.name)}</b>

      <br>

      ${player.score} نقطة
    `;

    box.appendChild(div);

  });

}


function escapeHtml(value){

  return String(value || "")
    .replace(
      /[&<>"]/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[character])
    );

}

</script>

</body>
</html>
