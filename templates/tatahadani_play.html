<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتحداني - لاعب</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#201044,#070711);color:white;font-family:Arial,Tahoma,sans-serif;text-align:center;min-height:100vh}.box{width:min(94%,680px);margin:18px auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.45)}h1{font-size:42px;margin:10px}.sub{opacity:.85;font-size:18px}input,button{font-size:24px;padding:15px;margin:8px;border-radius:16px;border:0}input{width:min(90%,360px)}button{background:#ffd43b;color:#111;font-weight:900;cursor:pointer}.timer{font-size:60px;color:#00ff9d;font-weight:900}.answerBox{min-height:70px;background:white;color:#111;border-radius:20px;padding:16px;margin:18px 0;font-size:34px;font-weight:900;word-break:break-word}.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.tile{background:#2f80ed;color:white;min-width:64px;font-size:32px;padding:17px 20px;border-radius:18px}.tile.used{opacity:.25;pointer-events:none}.msg{font-size:28px;color:#00ff9d;margin:14px}.wrong{color:#ff4b4b;font-size:23px;min-height:30px}.answer{font-size:28px;color:#ffd43b;font-weight:900}.leader{margin-top:18px}.row{display:flex;justify-content:space-between;gap:12px;background:rgba(255,255,255,.1);padding:12px 14px;border-radius:14px;margin:8px 0;font-size:20px}.podium{display:none}.medal{font-size:48px}.pod{background:rgba(255,255,255,.12);border-radius:18px;padding:14px;margin:10px 0}@media(max-width:520px){h1{font-size:34px}.tile{font-size:27px;min-width:58px}.answerBox{font-size:28px}}
</style>
</head>
<body>
<div id="joinBox" class="box">
  <h1>تتحداني ⚡</h1>
  <div class="sub">اكتب كود الهوست وادخل اسمك</div>
  <input id="pinInput" placeholder="كود اللعبة" inputmode="numeric"><br>
  <input id="nameInput" placeholder="اسمك"><br>
  <button onclick="joinGame()">دخول</button>
  <div id="joinError" class="wrong"></div>
</div>

<div id="gameBox" class="box" style="display:none">
  <h2>PIN: <span id="pinText"></span></h2>
  <div id="roundText" class="sub"></div>
  <div id="timeText" class="timer"></div>
  <div id="messageText" class="msg">انتظر السؤال</div>
  <div id="answerBox" class="answerBox"></div>
  <div class="tiles" id="tilesBox"></div>
  <div>
    <button onclick="backspace()">مسح</button>
    <button onclick="clearAnswer()">مسح الكل</button>
    <button onclick="submitAnswer()">إرسال</button>
  </div>
  <div id="correctAnswer" class="answer"></div>
  <div id="podiumBox" class="podium"></div>
  <div class="leader">
    <h2>الترتيب</h2>
    <div id="playersBox"></div>
  </div>
</div>

<script>
const socket = io();
let pin = "";
let selected = [];
let lastQuestionKey = null;
let answeredCurrent = false;

function joinGame(){
  pin = document.getElementById("pinInput").value.trim();
  const name = document.getElementById("nameInput").value.trim() || "Player";
  socket.emit("arabquiz_player_join", {pin, name});
}
socket.on("arabquiz_join_error", data=>{ document.getElementById("joinError").innerText = data.msg; });
socket.on("arabquiz_player_joined", data=>{
  pin = data.pin;
  document.getElementById("joinBox").style.display = "none";
  document.getElementById("gameBox").style.display = "block";
  document.getElementById("pinText").innerText = pin;
});
socket.on("arabquiz_wrong", data=>{ document.getElementById("messageText").innerText = "غلط، جرّب مرة ثانية"; });
socket.on("arabquiz_kicked",()=>{

    alert("تم طردك من الغرفة");

    location.href="/tatahadani-play";

});
  
socket.on("arabquiz_player_state", state=>{
  document.getElementById("pinText").innerText = state.pin;
  document.getElementById("roundText").innerText = "الجولة: " + state.round + "/" + state.roundLimit;
  document.getElementById("timeText").innerText = state.timeLeft || "";
  answeredCurrent = !!state.answered;

  if(state.status === "lobby") setMsg("انتظر الهوست يبدأ");
  else if(state.status === "question") setMsg(state.answered ? "تم إرسال إجابتك ✅" : "رتب الجواب");
  else if(state.status === "result") setMsg("انتهت الجولة");
  else if(state.status === "finished") setMsg("انتهت اللعبة 🏆");

  document.getElementById("correctAnswer").innerText = state.correctAnswer ? "الجواب الصحيح: " + state.correctAnswer : "";

  // مهم: لا نصفر الجواب مع تحديث التايمر، فقط عند سؤال جديد أو إذا انتهت الجولة
  if(lastQuestionKey !== state.questionKey){
    lastQuestionKey = state.questionKey;
    selected = [];
    updateAnswerBox();
    renderTiles(state.tiles || []);
  }else if(state.status !== "question" || state.answered){
    renderTiles([]);
  }

  if(state.status === "finished") renderPodium(state.podium || []);
  else document.getElementById("podiumBox").style.display = "none";

  renderPlayers(state.players || []);
});
function setMsg(t){ document.getElementById("messageText").innerText = t; }
function renderTiles(tiles){
  const box = document.getElementById("tilesBox"); box.innerHTML = "";
  tiles.forEach(t=>{
    const btn = document.createElement("button");
    btn.className = "tile";
    btn.innerText = t.text;
    btn.dataset.id = t.id;
    btn.onclick = ()=>{
      if(answeredCurrent) return;
      btn.classList.add("used");
      selected.push(t);
      updateAnswerBox();
    };
    box.appendChild(btn);
  });
}
function updateAnswerBox(){ document.getElementById("answerBox").innerText = selected.map(x=>x.text).join(" "); }
function backspace(){
  if(selected.length === 0 || answeredCurrent) return;
  const last = selected.pop();
  document.querySelectorAll(".tile").forEach(btn=>{ if(btn.dataset.id == last.id) btn.classList.remove("used"); });
  updateAnswerBox();
}
function clearAnswer(){
  if(answeredCurrent) return;
  selected = [];
  document.querySelectorAll(".tile").forEach(btn=>btn.classList.remove("used"));
  updateAnswerBox();
}
function submitAnswer(){
  if(answeredCurrent) return;
  const answer = selected.map(x=>x.text).join(" ");
  socket.emit("arabquiz_player_answer", {pin, answer});
}
function renderPlayers(players){
  const box = document.getElementById("playersBox"); box.innerHTML = "";
  players.forEach((p,i)=>{
    const div = document.createElement("div"); div.className = "row";
    const medal = i===0?'🏆 ':i===1?'🥈 ':i===2?'🥉 ':'';
    div.innerHTML = `<span>${medal}${i+1}. ${escapeHtml(p.name)}</span><b>${p.score}</b>`;
    box.appendChild(div);
  });
}
function renderPodium(podium){
  const box = document.getElementById("podiumBox"); box.style.display = "block"; box.innerHTML = "<h2>🏆 التتويج</h2>";
  const medals=["🏆","🥈","🥉"];
  podium.forEach((p,i)=>{
    const div = document.createElement("div"); div.className = "pod";
    div.innerHTML = `<div class="medal">${medals[i]}</div><b>${escapeHtml(p.name)}</b><br>${p.score} نقطة`;
    box.appendChild(div);
  });
}
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
</script>
</body>
</html>
