<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي البازل أونلاين</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:#071120;color:white;overflow:hidden}
#loginScreen{
position:fixed;inset:0;background:#071120;z-index:9999;
display:flex;align-items:center;justify-content:center;flex-direction:column
}
#loginScreen input{
padding:14px;font-size:20px;border-radius:12px;margin:8px;border:0
}
button{
padding:14px 28px;font-size:20px;border:0;border-radius:12px;
background:#2f6bff;color:white;cursor:pointer;margin:6px
}
.top{height:70px;background:#101b33;display:flex;align-items:center;justify-content:space-around;font-size:22px}
.app{display:grid;grid-template-columns:280px 1fr 280px;height:calc(100vh - 70px)}
.side{background:#0f1a30;padding:15px;overflow:auto}
.center{display:flex;align-items:center;justify-content:center;position:relative;flex-direction:column}
#board{
width:620px;height:620px;display:grid;gap:3px;background:#000;
border:5px solid white;border-radius:18px;overflow:hidden
}
.tile{
background-repeat:no-repeat;cursor:pointer;border:1px solid rgba(255,255,255,.2);
position:relative
}
.tile.selected{outline:6px solid #ffd166;outline-offset:-6px}
.tile.correct::after{
content:"✓";position:absolute;top:5px;left:8px;color:#45ff8a;
font-size:22px;font-weight:bold;text-shadow:0 0 8px #000
}
.card{background:#162744;border-radius:16px;padding:12px;margin-bottom:12px}
.player{background:#1d335c;border-radius:12px;padding:10px;margin:8px 0}
.bar{height:9px;background:#081120;border-radius:20px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:#45ff8a;width:0%}
#winScreen{
position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;
display:none;align-items:center;justify-content:center;flex-direction:column
}
#winScreen h1{font-size:70px;color:#ffd166;margin:0}
#preview{width:100%;border-radius:14px;margin-top:8px}
</style>
</head>

<body>

<div id="loginScreen">
  <h1>🧩 دخول تحدي البازل</h1>
  <input id="joinName" placeholder="اسم اللاعب">
  <input id="joinRoom" placeholder="رقم الروم" value="777">
  <button onclick="joinPuzzleRoom()">دخول الروم</button>
</div>

<div class="top">
  <div>🧩 تحدي البازل</div>
  <div>الروم: <b id="roomText">---</b></div>
  <div>⏱ <span id="timer">0</span> ثانية</div>
</div>

<div class="app">

<div class="side">
  <div class="card">
    <h3>⚙️ الإعدادات</h3>
    <select id="level" onchange="setLevel()" style="width:100%;padding:12px;border-radius:10px;font-size:18px">
      <option value="3">سهل 3×3</option>
      <option value="4" selected>متوسط 4×4</option>
      <option value="5">صعب 5×5</option>
    </select>
    <button onclick="startChallenge()">ابدأ التحدي</button>
    <button onclick="resetChallenge()">تصفير</button>
  </div>

  <div class="card">
    <h3>🖼️ صورة البازل</h3>
    <input type="file" accept="image/*" onchange="loadImage(event)">
    <button onclick="randomImage()">صورة عشوائية</button>
    <img id="preview" src="https://picsum.photos/900?random=77">
  </div>

  <div class="card">
    <h3>✅ تقدمي</h3>
    <div id="myProgress">0%</div>
  </div>
</div>

<div class="center">
  <div style="margin-bottom:10px;font-size:20px">اضغط قطعة أولى ثم اضغط قطعة ثانية للتبديل</div>
  <div id="board"></div>
</div>

<div class="side">
  <div class="card">
    <h3>🟢 اللاعبين</h3>
    <div id="playersBox"></div>
  </div>
</div>

</div>

<div id="winScreen">
  <h1>🏆 الفائز</h1>
  <p id="winnerText" style="font-size:32px"></p>
  <button onclick="resetChallenge()">لعبة جديدة</button>
</div>

<script>
const socket = io();

let puzzleRoom = "777";
let puzzleName = "لاعب";
let size = 4;
let imageUrl = "https://picsum.photos/900?random=77";
let tiles = [];
let firstSelected = null;
let started = false;
let timer = 0;
let interval = null;
let winner = null;

const board = document.getElementById("board");

function joinPuzzleRoom(){
  puzzleName = document.getElementById("joinName").value.trim();
  puzzleRoom = document.getElementById("joinRoom").value.trim() || "777";

  if(!puzzleName){
    alert("اكتب اسمك");
    return;
  }

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("roomText").innerText = puzzleRoom;

  socket.emit("puzzle_join", {
    name: puzzleName,
    room: puzzleRoom
  });
}

function buildBoard(shuffle=false){
  board.innerHTML = "";
  tiles = [];
  firstSelected = null;

  board.style.gridTemplateColumns = `repeat(${size},1fr)`;
  board.style.gridTemplateRows = `repeat(${size},1fr)`;

  for(let i=0;i<size*size;i++){
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.index = i;

    const x = i % size;
    const y = Math.floor(i / size);

    tile.style.backgroundImage = `url('${imageUrl}')`;
    tile.style.backgroundSize = `${size*100}% ${size*100}%`;
    tile.style.backgroundPosition = `${(x/(size-1))*100}% ${(y/(size-1))*100}%`;

    tile.onclick = () => selectTile(tile);

    tiles.push(tile);
  }

  if(shuffle){
    do{
      for(let i=tiles.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [tiles[i],tiles[j]] = [tiles[j],tiles[i]];
      }
    }while(tiles.every((t,i)=>parseInt(t.dataset.index)===i));
  }

  tiles.forEach(t=>board.appendChild(t));
  updateProgress();
}

function selectTile(tile){
  if(!started || winner) return;

  if(!firstSelected){
    firstSelected = tile;
    tile.classList.add("selected");
    return;
  }

  if(firstSelected === tile){
    tile.classList.remove("selected");
    firstSelected = null;
    return;
  }

  swapTiles(firstSelected, tile);
  firstSelected.classList.remove("selected");
  firstSelected = null;

  updateProgress();
  checkWin();
}

function swapTiles(a,b){
  const children = [...board.children];
  const ai = children.indexOf(a);
  const bi = children.indexOf(b);

  const ph = document.createElement("div");
  board.insertBefore(ph, a);
  board.insertBefore(a, b);
  board.insertBefore(b, ph);
  board.removeChild(ph);
}

function updateProgress(){
  const current = [...board.children];
  let correct = 0;

  current.forEach((tile,index)=>{
    const ok = parseInt(tile.dataset.index) === index;
    tile.classList.toggle("correct", ok);
    if(ok) correct++;
  });

  const pct = Math.round((correct/current.length)*100);
  document.getElementById("myProgress").innerText = pct + "%";

  socket.emit("puzzle_progress", {
    room: puzzleRoom,
    progress: pct,
    time: timer
  });
}

function checkWin(){
  const current = [...board.children];
  const ok = current.every((tile,index)=>parseInt(tile.dataset.index)===index);

  if(ok && !winner){
    winner = puzzleName;
    started = false;
    clearInterval(interval);

    socket.emit("puzzle_finish", {
      room: puzzleRoom,
      time: timer
    });

    showWinner(puzzleName);
  }
}

function showWinner(name){
  document.getElementById("winnerText").innerText =
    name + " خلص خلال " + timer + " ثانية";
  document.getElementById("winScreen").style.display = "flex";
}

function startChallenge(){
  winner = null;
  started = true;
  timer = 0;
  document.getElementById("timer").innerText = timer;
  document.getElementById("winScreen").style.display = "none";

  clearInterval(interval);
  buildBoard(true);

  interval = setInterval(()=>{
    timer++;
    document.getElementById("timer").innerText = timer;
  },1000);

  socket.emit("puzzle_reset", {room:puzzleRoom});
}

function resetChallenge(){
  winner = null;
  started = false;
  timer = 0;
  clearInterval(interval);
  document.getElementById("timer").innerText = 0;
  document.getElementById("winScreen").style.display = "none";
  buildBoard(false);

  socket.emit("puzzle_reset", {room:puzzleRoom});
}

function setLevel(){
  size = parseInt(document.getElementById("level").value);
  buildBoard(false);
}

function loadImage(event){
  const file = event.target.files[0];
  if(!file) return;
  imageUrl = URL.createObjectURL(file);
  document.getElementById("preview").src = imageUrl;
  buildBoard(false);
}

function randomImage(){
  imageUrl = "https://picsum.photos/900?random=" + Math.floor(Math.random()*9999);
  document.getElementById("preview").src = imageUrl;
  buildBoard(false);
}

socket.on("puzzle_state", function(state){
  const box = document.getElementById("playersBox");
  box.innerHTML = "";

  let players = state.players || [];

  players.sort((a,b)=>{
    if(b.progress !== a.progress) return b.progress - a.progress;
    return a.time - b.time;
  });

  players.forEach((p,i)=>{
    box.innerHTML += `
      <div class="player">
        <b>${i+1}. ${p.name}</b><br>
        <small>${p.progress}% - ${p.time || 0} ثانية</small>
        <div class="bar"><div class="fill" style="width:${p.progress}%"></div></div>
      </div>
    `;
  });

  if(state.winner && !winner){
    winner = state.winner;
    started = false;
    clearInterval(interval);
    showWinner(state.winner);
  }
});

buildBoard(false);
</script>

</body>
</html>
