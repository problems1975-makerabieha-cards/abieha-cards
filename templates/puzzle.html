<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي البازل أونلاين</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#071126;
  color:white;
}

#loginScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:linear-gradient(180deg,#0c2b5d,#071126);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:35px;
}

#loginScreen h1{
  font-size:42px;
  text-shadow:0 4px 8px #000;
  margin-bottom:18px;
}

.loginBox{
  width:96%;
  min-height:90px;
  background:rgba(11,35,75,.75);
  border:1px solid rgba(120,190,255,.35);
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:18px;
}

input,select{
  border:0;
  border-radius:14px;
  padding:12px 14px;
  margin:6px;
  font-size:16px;
  min-width:160px;
}

button{
  border:0;
  border-radius:15px;
  padding:12px 18px;
  margin:6px;
  font-weight:900;
  cursor:pointer;
  color:#071126;
  background:linear-gradient(180deg,#fff0a6,#ffd166);
  box-shadow:0 7px 0 #9b6a00,0 12px 22px #0008;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 3px 0 #9b6a00;
}

.green{
  background:linear-gradient(180deg,#7affb2,#35dd7b);
  box-shadow:0 7px 0 #0b7d3b,0 12px 22px #0008;
}
</style>
</head>

<body>

<div id="loginScreen">
  <h1>🧩 أبيها - تحدي التركيب</h1>

  <div class="loginBox">
    <input id="joinName" placeholder="اسم اللاعب">

    <select id="playMode">
      <option value="solo">فردي</option>
      <option value="teams">فرق</option>
    </select>

    <input id="joinRoom" value="ROOM1" placeholder="رقم الروم">

    <button class="green" onclick="joinPuzzleRoom()">دخول</button>
  </div>
</div>

<div class="app">

<div class="side">
  <div class="card">
    <h3>⚙️ الإعدادات</h3>
    <select id="level" onchange="setLevel()" style="width:100%;padding:12px;border-radius:10px;font-size:18px">
      <option value="3">سهل 3×3</option>
      <option value="4" selected>متوسط 4×4</option>
      <option value="5">صعب 5×5</option>
    </select>
    <button onclick="startChallenge()">ابدأ التحدي</button>
    <button onclick="resetChallenge()">تصفير</button>
  </div>

  <div class="card">
    <h3>🖼️ صورة البازل</h3>
    <input type="file" accept="image/*" onchange="loadImage(event)">
    <button onclick="randomImage()">صورة عشوائية</button>
    <img id="preview" src="https://picsum.photos/900?random=77">
  </div>

  <div class="card">
    <h3>✅ تقدمي</h3>
    <div id="myProgress">0%</div>
  </div>
</div>

<div class="center">
  <div style="margin-bottom:10px;font-size:20px">اضغط قطعة أولى ثم اضغط قطعة ثانية للتبديل</div>
  <div id="board"></div>
</div>

<div class="side">
  <div class="card">
    <h3>🟢 اللاعبين</h3>
    <div id="playersBox"></div>
  </div>
</div>

</div>

<div id="winScreen">
  <h1>🏆 الفائز</h1>
  <p id="winnerText" style="font-size:32px"></p>
  <button onclick="resetChallenge()">لعبة جديدة</button>
</div>

<script>
const socket = io();

let puzzleRoom = "777";
let puzzleName = "لاعب";
let size = 4;
let imageUrl = "https://picsum.photos/900?random=77";
let tiles = [];
let firstSelected = null;
let started = false;
let timer = 0;
let interval = null;
let winner = null;

const board = document.getElementById("board");

function joinPuzzleRoom(){
  puzzleName = document.getElementById("joinName").value.trim();
  puzzleRoom = document.getElementById("joinRoom").value.trim() || "777";

  if(!puzzleName){
    alert("اكتب اسمك");
    return;
  }

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("roomText").innerText = puzzleRoom;

  socket.emit("puzzle_join", {
    name: puzzleName,
    room: puzzleRoom
  });
}

function buildBoard(shuffle=false){
  board.innerHTML = "";
  tiles = [];
  firstSelected = null;

  board.style.gridTemplateColumns = `repeat(${size},1fr)`;
  board.style.gridTemplateRows = `repeat(${size},1fr)`;

  for(let i=0;i<size*size;i++){
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.index = i;

    const x = i % size;
    const y = Math.floor(i / size);

    tile.style.backgroundImage = `url('${imageUrl}')`;
    tile.style.backgroundSize = `${size*100}% ${size*100}%`;
    tile.style.backgroundPosition = `${(x/(size-1))*100}% ${(y/(size-1))*100}%`;

    tile.onclick = () => selectTile(tile);

    tiles.push(tile);
  }

  if(shuffle){
    do{
      for(let i=tiles.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [tiles[i],tiles[j]] = [tiles[j],tiles[i]];
      }
    }while(tiles.every((t,i)=>parseInt(t.dataset.index)===i));
  }

  tiles.forEach(t=>board.appendChild(t));
  updateProgress();
}

function selectTile(tile){
  if(!started || winner) return;

  if(!firstSelected){
    firstSelected = tile;
    tile.classList.add("selected");
    return;
  }

  if(firstSelected === tile){
    tile.classList.remove("selected");
    firstSelected = null;
    return;
  }

  swapTiles(firstSelected, tile);
  firstSelected.classList.remove("selected");
  firstSelected = null;

  updateProgress();
  checkWin();
}

function swapTiles(a,b){
  const children = [...board.children];
  const ai = children.indexOf(a);
  const bi = children.indexOf(b);

  const ph = document.createElement("div");
  board.insertBefore(ph, a);
  board.insertBefore(a, b);
  board.insertBefore(b, ph);
  board.removeChild(ph);
}

function updateProgress(){
  const current = [...board.children];
  let correct = 0;

  current.forEach((tile,index)=>{
    const ok = parseInt(tile.dataset.index) === index;
    tile.classList.toggle("correct", ok);
    if(ok) correct++;
  });

  const pct = Math.round((correct/current.length)*100);
  document.getElementById("myProgress").innerText = pct + "%";

  socket.emit("puzzle_progress", {
    room: puzzleRoom,
    progress: pct,
    time: timer
  });
}

function checkWin(){
  const current = [...board.children];
  const ok = current.every((tile,index)=>parseInt(tile.dataset.index)===index);

  if(ok && !winner){
    winner = puzzleName;
    started = false;
    clearInterval(interval);

    socket.emit("puzzle_finish", {
      room: puzzleRoom,
      time: timer
    });

    showWinner(puzzleName);
  }
}

function showWinner(name){
  document.getElementById("winnerText").innerText =
    name + " خلص خلال " + timer + " ثانية";
  document.getElementById("winScreen").style.display = "flex";
}

function startChallenge(){
  winner = null;
  started = true;
  timer = 0;
  document.getElementById("timer").innerText = timer;
  document.getElementById("winScreen").style.display = "none";

  clearInterval(interval);
  buildBoard(true);

  interval = setInterval(()=>{
    timer++;
    document.getElementById("timer").innerText = timer;
  },1000);

  socket.emit("puzzle_reset", {room:puzzleRoom});
}

function resetChallenge(){
  winner = null;
  started = false;
  timer = 0;
  clearInterval(interval);
  document.getElementById("timer").innerText = 0;
  document.getElementById("winScreen").style.display = "none";
  buildBoard(false);

  socket.emit("puzzle_reset", {room:puzzleRoom});
}

function setLevel(){
  size = parseInt(document.getElementById("level").value);
  buildBoard(false);
}

function loadImage(event){
  const file = event.target.files[0];
  if(!file) return;
  imageUrl = URL.createObjectURL(file);
  document.getElementById("preview").src = imageUrl;
  buildBoard(false);
}

function randomImage(){
  imageUrl = "https://picsum.photos/900?random=" + Math.floor(Math.random()*9999);
  document.getElementById("preview").src = imageUrl;
  buildBoard(false);
}

socket.on("puzzle_state", function(state){
  const box = document.getElementById("playersBox");
  box.innerHTML = "";

  let players = state.players || [];

  players.sort((a,b)=>{
    if(b.progress !== a.progress) return b.progress - a.progress;
    return a.time - b.time;
  });

  players.forEach((p,i)=>{
    box.innerHTML += `
      <div class="player">
        <b>${i+1}. ${p.name}</b><br>
        <small>${p.progress}% - ${p.time || 0} ثانية</small>
        <div class="bar"><div class="fill" style="width:${p.progress}%"></div></div>
      </div>
    `;
  });

  if(state.winner && !winner){
    winner = state.winner;
    started = false;
    clearInterval(interval);
    showWinner(state.winner);
  }
});

buildBoard(false);
</script>

</body>
</html>
